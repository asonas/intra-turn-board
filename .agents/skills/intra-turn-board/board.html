<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intra-turn Board</title>
<style>
:root{
  --bg:#edf0f5; --dot:#c9cfdb; --ink:#1f2329; --sub:#6b7280; --faint:#9aa1ad;
  --note:#fff4bf; --note-edge:#e8d98a; --card:#ffffff; --line:#d9dee8;
  --accent:#2f4f9e; --accent-soft:#e3e9f7; --accent-ink:#22407f;
  --danger:#b3261e;
  --pop:#ffffff; --shadow:0 1px 2px #1f232914,0 8px 24px #1f23291a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;font:15px/1.75 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}

/* ---- board ---- */
#viewport{position:fixed;inset:0;background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:24px 24px;touch-action:none;cursor:default}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#links path{fill:none;stroke:#93a1c4;stroke-width:1.5}
#links path.dashed{stroke-dasharray:4 4}
#links path.live{stroke:var(--accent)}
.item{position:absolute;isolation:isolate;z-index:1}
.item.note{z-index:2}
.item.lifted{z-index:5}

header.bar{position:fixed;top:16px;left:16px;right:16px;display:flex;align-items:center;gap:12px;pointer-events:none;z-index:20}
header.bar>*{pointer-events:auto}
header.bar h1{font-size:18px;margin:0 12px 0 4px;font-weight:700;letter-spacing:.01em}
.examples{display:flex;gap:4px;background:#fff;border-radius:10px;padding:4px;box-shadow:var(--shadow)}
.examples button{border:0;background:transparent;border-radius:7px;padding:4px 10px;font-size:13px;color:var(--sub)}
.examples button:hover{background:var(--accent-soft);color:var(--accent-ink)}
.add{margin-left:auto;display:flex;align-items:center;gap:6px;border:0;background:#1f2a24;color:#fff;border-radius:9px;padding:7px 12px;font-size:13px;box-shadow:var(--shadow)}

/* ---- note (human) ---- */
.note{width:300px;background:var(--note);border-radius:6px;padding:10px 16px 12px;box-shadow:1px 2px 0 var(--note-edge),0 10px 24px #6b5d1a1f;transition:box-shadow .2s}
.note .grip{height:10px;margin:-10px -16px 4px;cursor:grab;border-radius:6px 6px 0 0}
.note .grip:active{cursor:grabbing}
.assume{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--sub);margin:2px 0 6px;animation:rise .25s ease-out}
.assume .ic{color:var(--accent);transform:translateY(2px)}
.val{border:0;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline dotted var(--accent);text-decoration-thickness:1.5px;text-underline-offset:4px}
.val:hover{color:var(--accent-ink)}
.field{position:relative}
.field .mirror,.field textarea{font:inherit;font-size:16px;line-height:1.75;letter-spacing:normal;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;padding:0;margin:0;border:0}
.field .mirror{position:absolute;inset:0;color:transparent;pointer-events:none;overflow:hidden;transition:opacity .15s}
.field .mirror.stale{opacity:0}
.field .kw{background:#2f4f9e14;border-radius:3px;text-decoration:underline dotted var(--accent);text-decoration-thickness:1.5px;text-underline-offset:5px}
.field .kw.set{text-decoration-style:solid;background:#2f4f9e22}
.field textarea{position:relative;display:block;width:100%;background:transparent;resize:none;outline:none;overflow:hidden;color:var(--ink);min-height:28px;caret-color:var(--accent)}
.field textarea::placeholder{color:#a89f74}
.note .foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:6px;min-height:30px}
.status{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-right:auto}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;display:none}
.status.thinking{color:var(--sub)} .status.thinking::before{display:block;animation:blink 1s infinite}
.status.arrived,.status.needs{color:var(--accent)} .status.arrived::before,.status.needs::before{display:block}
.status.done{color:var(--sub)} .status.done::before{display:block;background:#9aa8c8}
.status.failed{color:var(--danger)} .status.failed::before{display:block}
.send{width:30px;height:30px;border-radius:50%;border:0;background:#1f2a24;color:#fff;display:flex;align-items:center;justify-content:center}
.send:disabled{background:#d8cf9f;cursor:default}
.note.sent{background:#fff8d6}
.note.sent .send{display:none}
.note.sent textarea{cursor:default}
.quote{margin:2px 0 8px;padding:2px 0 2px 10px;border-left:2px solid var(--accent);font-size:13px;color:var(--sub);white-space:pre-wrap}

/* ---- card (AI) ---- */
.card{width:380px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:0 20px 14px;outline:2px solid transparent;transition:outline-color .3s}
.card header{display:flex;align-items:center;gap:6px;height:38px;margin:0 -20px 0;padding:0 20px;cursor:grab;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.card header:active{cursor:grabbing}
.card header .from{font-weight:400;color:var(--faint);margin-left:auto;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.fresh{animation:ring 1.6s ease-out 2}
.card.fresh header::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:8px;order:3}
.decisions{list-style:none;margin:0 0 10px;padding:0 0 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--faint)}
.decisions li{display:flex;gap:8px;align-items:baseline;animation:rise .3s ease-out both}
.decisions li .ic{color:#8d9bbf;transform:translateY(2px)}
.decisions b{font-weight:500;color:var(--ink)}
.body{font-size:15px}
.body p{margin:0 0 10px}
.body h3{font-size:15px;margin:14px 0 6px}
.body ul{margin:0 0 10px;padding-left:1.2em}
.body li{margin:2px 0}
.body blockquote{margin:6px 0 10px;padding:8px 12px;background:#f4f6fa;border-radius:8px;font-size:14px}
.body>*,.part>*{animation:fadein .25s ease-out}
.blank{border:0;background:#eef1f6;border-radius:4px;padding:0 4px;margin:0 1px;font:inherit;color:var(--sub);text-decoration:underline dashed #8d9bbf;text-underline-offset:4px;animation:blankin .4s ease-out}
.blank:hover{background:var(--accent-soft);color:var(--accent-ink)}
.blank.filled{background:transparent;color:var(--ink);text-decoration:underline solid var(--accent);text-decoration-thickness:1.5px;padding:0;margin:0}
.ref{text-decoration:underline solid #b6c1db;text-decoration-thickness:1.5px;text-underline-offset:4px}
.cfoot{font-size:12px;color:var(--faint);min-height:18px}
.cfoot.needs{color:var(--accent)}
.cfoot.error{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;color:var(--danger)}
.retry{border:1px solid currentColor;background:#fff;border-radius:999px;padding:0 10px;font-size:12px;line-height:20px;color:inherit}
.retry:hover{background:#fbeceb}
.retry:disabled{opacity:.5;cursor:default}
.skeleton{padding:4px 0 8px}
.skeleton i{display:block;height:10px;border-radius:5px;margin:10px 0;background:linear-gradient(90deg,#eef1f6 0,#dfe5ef 40%,#eef1f6 80%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
.skeleton i:nth-child(2){width:80%} .skeleton i:nth-child(3){width:55%}

/* posters */
.posters{display:flex;gap:12px;margin:6px 0 12px}
.posters figure{margin:0;font-size:12px;color:var(--sub);text-align:center}
.pst{--c:#ef5a3c;width:150px;aspect-ratio:3/4;background:#f7f3ea;position:relative;overflow:hidden;border-radius:4px;box-shadow:0 0 0 1px #0000000f;text-align:left;color:#16181b;font-weight:800;line-height:1.1}
.pst .t{position:absolute;font-size:19px;z-index:2}
.pst .s{position:absolute;font-size:8px;font-weight:600;z-index:2;opacity:.8}
.pst .d{position:absolute;font-size:7px;font-weight:600;z-index:2;bottom:8px;right:8px}
.pst .g{position:absolute;z-index:1}
.pst.big .t{font-size:24px}
.pst.vertical .t{writing-mode:vertical-rl;font-size:20px}
.pst.invert .t{background:var(--c);color:#fff;padding:3px 5px}
.pst.whitespace .t{left:12px;bottom:28px;font-size:15px}
.pst.whitespace.big .t{font-size:20px}
.pst.whitespace .s{left:12px;bottom:18px}
.pst.whitespace .g.a{width:14px;height:14px;border-radius:50%;background:var(--c);right:16px;top:16px}
.pst.geo{background:#efe9dc}
.pst.geo .t{left:10px;top:12px}
.pst.geo .s{left:10px;top:64px}
.pst.geo .g.a{width:90px;height:90px;border-radius:50% 0 0 0;background:var(--c);right:0;bottom:0}
.pst.geo .g.b{width:60px;height:46px;background:#16181b;left:0;bottom:0}
.pst.geo .g.c{width:30px;height:30px;border-radius:50%;background:#b9b3a6;right:16px;top:40px}
.pst.grid{background:#f7f6f1;background-image:linear-gradient(#0000000d 1px,transparent 1px),linear-gradient(90deg,#0000000d 1px,transparent 1px);background-size:12px 12px}
.pst.grid .t{left:10px;top:12px}
.pst.grid .s{left:10px;top:64px}
.pst.grid .g.a{left:10px;right:10px;top:84px;height:2px;background:var(--c)}
.pst.grid .g.b{left:10px;width:60%;top:96px;height:6px;background:#16181b33;box-shadow:0 12px 0 #16181b22,0 24px 0 #16181b22}
.pst.flat .t{left:10px;top:12px}
.pst.flat .s{left:10px;top:64px}
.pst.flat .g.a{width:110px;height:110px;border-radius:50%;background:var(--c);right:-30px;bottom:-20px}
.pst.flat .g.b{width:50px;height:50px;border-radius:50%;background:#f2c94c;left:12px;bottom:26px}
.pst.flat .g.c{width:36px;height:36px;border-radius:50%;background:#16181b;left:56px;bottom:66px}
.pst.thumb{width:64px}
.pst.thumb .t{font-size:10px}.pst.thumb .s,.pst.thumb .d{display:none}
.pst.thumb.geo .g.a{width:40px;height:40px}.pst.thumb.geo .g.b{width:26px;height:20px}.pst.thumb.geo .g.c{width:14px;height:14px;top:22px;right:8px}
.pst.thumb.whitespace .t{left:6px;bottom:8px;font-size:9px}.pst.thumb.whitespace .g.a{width:8px;height:8px;right:8px;top:8px}
.pst.thumb.grid .t,.pst.thumb.flat .t,.pst.thumb.geo .t{left:6px;top:6px}.pst.thumb.grid .g.a{top:30px;left:6px;right:6px}.pst.thumb.grid .g.b{top:36px;left:6px;height:3px;box-shadow:0 6px 0 #16181b22,0 12px 0 #16181b22}
.pst.thumb.flat .g.a{width:50px;height:50px;right:-14px;bottom:-10px}.pst.thumb.flat .g.b{width:22px;height:22px;left:6px;bottom:10px}.pst.thumb.flat .g.c{width:14px;height:14px;left:24px;bottom:30px}

/* ---- popover ---- */
#pop{position:fixed;z-index:40;background:var(--pop);border-radius:14px;box-shadow:0 2px 4px #1f232914,0 16px 40px #1f232930;padding:12px 14px;min-width:220px;max-width:340px;animation:popin .14s ease-out;transform-origin:top left}
#pop section+section{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
#pop .q{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--sub);margin-bottom:8px}
#pop .q .hint{color:var(--faint)}
#pop .q .now{margin-left:auto;font-weight:700;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;border:0;background:none;text-align:left;padding:5px 8px;border-radius:8px;font-size:14px}
.opt:hover{background:#f1f3f7}
.opt .ic{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:13px}
.chip:hover{border-color:#b8c2d8}
.chip.on{background:#1f2329;border-color:#1f2329;color:#fff}
.other{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px 3px 8px;font-size:13px;color:var(--sub);margin-top:8px}
.other-input{margin-top:8px;width:100%;font:inherit;font-size:13px;border:1px solid #b8c2d8;border-radius:8px;padding:5px 10px;outline:none}
.other-input:focus{border-color:var(--accent)}
.free{display:flex;align-items:center;gap:6px}
.free .other-input{margin-top:0;width:auto;flex:1;min-width:0}
.free .unit{font-size:13px;color:var(--sub)}
.map{position:relative;height:170px;width:280px;border-radius:10px;background-color:#f7f8fb;background-image:radial-gradient(#d5dbe6 1px,transparent 1.2px);background-size:10px 10px}
.map .chip{position:absolute;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.map .chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.range{position:relative;height:28px;margin:0 8px;width:240px;touch-action:none}
.range .track{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:#e3e7ee}
.range .fill{position:absolute;top:12px;height:4px;border-radius:2px;background:#1f2329}
.range .ticks{position:absolute;left:0;right:0;top:13px;display:flex;justify-content:space-between;pointer-events:none}
.range .ticks i{width:2px;height:2px;border-radius:50%;background:#9aa1ad}
.range .h{position:absolute;top:5px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #c6ccd8,0 1px 3px #0003;cursor:grab;touch-action:none}
.range .h:active{cursor:grabbing}
.swatches{display:flex;gap:10px}
.sw{width:32px;height:32px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px #0000001a;position:relative}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px #1f2329}
.swname{font-size:12px;color:var(--sub);margin-top:6px;min-height:18px}
.thumbs{display:flex;gap:8px}
.thumbs button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--sub);width:70px}
.thumbs button .pst{outline:2px solid transparent;outline-offset:2px;transition:outline-color .15s}
.thumbs button.on .pst{outline-color:#1f2329}
.thumbs button:hover .pst{outline-color:#b8c2d8}
.pad{display:grid;grid-template-columns:auto 140px auto;grid-template-rows:auto 140px auto;align-items:center;justify-items:center;gap:4px;font-size:12px;color:var(--sub)}
.pad .area{grid-column:2;grid-row:2;width:140px;height:140px;border-radius:12px;background:#f3f5f8;position:relative;background-image:linear-gradient(#d5dbe6,#d5dbe6),linear-gradient(#d5dbe6,#d5dbe6);background-size:1px 100%,100% 1px;background-position:center;background-repeat:no-repeat}
.pad .pt{position:absolute;width:22px;height:22px;margin:-11px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.pad .pt::after{content:"";width:7px;height:7px;border-radius:50%;background:#9aa1ad;transition:transform .15s,background .15s}
.pad .area{cursor:pointer}
.pad .pt.hover::after,.pad .pt:focus-visible::after{transform:scale(1.6);background:#5b6474}
.pad .pt.on::after{width:12px;height:12px;background:#1f2329}
.preview{margin-top:10px;background:#f3f5f8;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7;min-height:64px;max-width:300px;color:var(--ink)}
.preview:empty{background:repeating-linear-gradient(-45deg,#f3f5f8 0 6px,#eef1f5 6px 12px)}

/* follow-up + markers */
#ask{position:fixed;z-index:30;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#1f2329;color:#fff;font-size:12px;padding:5px 12px 5px 9px;box-shadow:var(--shadow);animation:popin .12s ease-out}
.marker{position:fixed;z-index:25;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;padding:5px 12px 5px 8px;box-shadow:var(--shadow);animation:popin .2s ease-out;max-width:220px;white-space:nowrap}
.marker span:last-child{overflow:hidden;text-overflow:ellipsis}

@keyframes rise{from{opacity:0;transform:translateY(4px)}}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{opacity:0;transform:scale(.97)}}
@keyframes blink{50%{opacity:.25}}
@keyframes shimmer{to{background-position:-300% 0}}
@keyframes ring{0%{outline-color:#2f4f9e}100%{outline-color:transparent}}
@keyframes blankin{0%{background:#cdd7ef}100%{background:#eef1f6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="links"></svg></div></div>
<header class="bar">
  <h1>Intra-turn Board</h1>
  <nav class="examples" aria-label="例">
    <button data-ex="travel">京都旅行</button>
    <button data-ex="birthday">還暦の夕食</button>
    <button data-ex="poster">告知ポスター</button>
    <button data-ex="naming">アプリの名前</button>
  </nav>
  <button class="add" id="add"></button>
</header>
<div id="pop" hidden></div>
<button id="ask" hidden></button>
<div id="markers"></div>

<script>
'use strict'
/* ============ 小道具 ============ */
const $ = (s, r = document) => r.querySelector(s)
const sleep = ms => new Promise(r => setTimeout(r, ms))
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue
    if (k === 'class') el.className = v
    else if (k === 'style') el.style.cssText = v
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else el.setAttribute(k, v === true ? '' : v)
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k))
  return el
}
// Lucide (ISC) のパス

  arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',

  calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',

  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  mapPin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  palette: '<circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',

/* ============ キーワード候補（Kuromoji） ============
   Candidate = { surface, start, end, kind: 'proper' | 'compound' | 'noun' }（start/end は文字列の添字）
   候補を取り出す extractCandidates と、順位を付ける rank は別々の純関数にしてある。
   rank を外部の判定器に差し替えても、取り出す側は変わらない */
const KUROMOJI = {
  script: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js',

let tokenizer = null   // 辞書を読み終えるまでは null。その間は LEXICON だけで解析する

function startKuromoji(onReady) {
  const t0 = performance.now()
  const giveUp = e => console.warn('[kuromoji] 辞書を読み込めなかったので、LEXICON の語だけで解析します', e)
  document.head.append(h('script', {

    onerror: () => giveUp('kuromoji.js を取得できませんでした'),
    onload: () => kuromoji.builder({ dicPath: KUROMOJI.dict }).build((err, tk) => {
      if (err) return giveUp(err)
      tokenizer = tk
      console.info(`[kuromoji] dictionary ready in ${Math.round(performance.now() - t0)} ms`)
      onReady()
    }),
  }))
}

// 名詞の細分類ごとに、句の中での役割を決める表。ここに無いもの（代名詞・非自立・副詞可能など）は句を切る
const NOUN_ROLE = { '固有名詞': 'proper', '一般': 'word', 'サ変接続': 'word', '数': 'number', '接尾': 'suffix' }

// start は surface_form の長さを足して数える。word_position はコードポイント単位で、絵文字があると文字列の添字とずれる
function extractCandidates(tokens) {
  const out = [], seen = new Set()
  let run = [], at = 0
  const flush = () => {
    const surface = run.map(t => t.surface).join('')
    const words = run.filter(t => t.role === 'proper' || t.role === 'word')
    if (words.length && surface.length >= 2 && !seen.has(surface)) {
      seen.add(surface)
      const start = run[0].start
      out.push({ surface, start, end: start + surface.length, kind: words.some(t => t.role === 'proper') ? 'proper' : words.length > 1 ? 'compound' : 'noun' })
    }
    run = []
  }
  for (const t of tokens) {
    const role = t.pos === '名詞' ? NOUN_ROLE[t.pos_detail_1] : undefined
    const tok = { role, surface: t.surface_form, start: at }
    at += t.surface_form.length
    if (role === 'suffix' && !run.length) continue   // 接尾辞は前の語に付くもので、句の頭にはならない
    if (role) run.push(tok); else flush()
  }
  flush()
  return out
}

const KIND_RANK = { proper: 0, compound: 1, noun: 2 }
// いまは種類と出現順だけで決める。text は、文脈を読む判定器に差し替えるときのために受け取っている
function rank(candidates, text) {
  return [...candidates].sort((a, b) => KIND_RANK[a.kind] - KIND_RANK[b.kind] || a.start - b.start)
}

function keywordCandidates(text) {
  if (!tokenizer) return []
  const t0 = performance.now()
  const ranked = rank(extractCandidates(tokenizer.tokenize(text)), text)
  console.debug(`[kuromoji] analyze ${(performance.now() - t0).toFixed(1)} ms`)
  return ranked
}

/* ============ 在庫（会話の未決の論点） ============
   サーバーが起動時に会話から作る。届くまでボードは在庫なしで動き、届いたら書きかけの付箋を解析し直す。
   いま使うのは open だけで、facts はまだ使わない (#4)。file:// の見本には在庫が無い */
let inventory = null   // 届いたら { open: [...], facts: [...] }

// 暫定の対応づけ。#3 で Jev の判定に置き換える。
// surfaces の語ごとに、topic と語のどちらかがもう一方を含む論点のうち、先の語がまだ取っていない最初のものの添字を返す。無ければ -1
function matchInventory(surfaces, open) {
  const taken = new Set()
  return surfaces.map(s => {
    const i = open.findIndex((o, k) => !taken.has(k) && (o.topic.includes(s) || s.includes(o.topic)))
    if (i >= 0) taken.add(i)
    return i
  })
}

// 在庫の論点を、下線に結ぶ前提の項目にする。会話では未決なので def は置かない (選ぶまでは前提として送らない)。
// single / chips はそのまま、range と text は自由入力 (range の options は単位だけ)
function inventoryEntry(item, index) {
  const free = item.widget === 'range' || item.widget === 'text'
  const sec = { key: 'inv:' + index, q: item.question, say: [`${item.topic}は`, ''] }
  Object.assign(sec, free
    ? { type: 'free', unit: item.widget === 'range' ? item.options[0] : undefined }
    : { type: item.widget, options: item.options, multi: item.multiple, hint: item.multiple ? '複数可' : null })
  return { id: 'inv:' + index, words: [item.topic], icon: 'tag', sections: [sec] }
}

/* ============ 前提の解析（Feedforward） ============
   入力中の文から前提を見つける。モデルは呼ばず、常にこのローカルの規則だけで動く。
   LEXICON の語を先に取り、空いている分（合計3つまで）を Kuromoji の候補で埋める。
   候補が在庫の論点に当たれば、一般的な問いの代わりに在庫の問いを開く。LEXICON の語は在庫に置き換えない */
const MAX_ASSUMPTIONS = 3
function analyze(text) {
  const hits = []
  for (const e of LEXICON) {
    let best = null
    for (const w of e.words) { const i = text.indexOf(w); if (i >= 0 && (!best || i < best.start)) best = { start: i, end: i + w.length } }
    if (best) hits.push({ ...best, entry: e })
  }
  const len = text.trim().length, lexicon = hits.length
  if (len >= 6) {
    const open = inventory?.open ?? []
    const candidates = keywordCandidates(text).filter(c => !hits.some(m => c.start < m.end && m.start < c.end))
    const matched = matchInventory(candidates.map(c => c.surface), open)
    // 上限があるので、会話から来た問いに当たる語を、一般的な問いの語より先に使う
    candidates.map((c, i) => ({ c, item: matched[i] }))
      .sort((a, b) => (b.item >= 0) - (a.item >= 0))
      .slice(0, Math.max(0, MAX_ASSUMPTIONS - lexicon))
      .forEach(({ c, item }) => hits.push({ start: c.start, end: c.end, entry: item >= 0 ? inventoryEntry(open[item], item) : genericEntry(c) }))
  }
  if (!lexicon && len >= 8) hits.push({ start: -1, end: -1, entry: GENERIC_TOP })
  hits.sort((a, b) => a.start - b.start)
  const out = []; let last = -1
  for (const m of hits) { if (m.start >= 0 && m.start < last) continue; out.push(m); if (m.start >= 0) last = m.end }
  return out
}

/* ============ server.mjs の応答 ============
   サーバーが返す Draft {blocks, blanks} と Continuation {blocks} を、ここで境界を越えてトークンに直す。
   blocks[].text 中の [[key]] は、part1 では空欄、part2 では選んだ値の参照になる。
   draft に無いキーは書かれたとおりの文字として残す。 */
const MARKER = /\[\[([a-z][a-z0-9_]{0,31})\]\]/g
const BLOCK_TOKEN = { heading: 'h', paragraph: 'p', quote: 'quote' }

function inlineParts(text, keys, as) {
  const out = []; let i = 0
  for (const m of text.matchAll(MARKER)) {
    if (!keys.has(m[1])) continue
    if (m.index > i) out.push(text.slice(i, m.index))
    out.push({ [as]: m[1] }); i = m.index + m[0].length
  }
  if (i < text.length) out.push(text.slice(i))
  return out
}
function blocksToTokens(blocks, keys, as) {
  const out = []
  for (const b of blocks) {
    const parts = inlineParts(b.text, keys, as)
    if (b.kind !== 'item') { out.push({ [BLOCK_TOKEN[b.kind] || 'p']: parts }); continue }
    const last = out.at(-1)
    if (last?.ul) last.ul.push(parts); else out.push({ ul: [parts] })
  }
  return out
}
// /continue に渡す draft。空欄は選んだ値に置き換えて、モデルが読める文章に戻す
function blocksToText(blocks, keys, valueOf) {
  const lead = { heading: '## ', item: '- ', quote: '> ' }
  return blocks.map(b => (lead[b.kind] || '') + b.text.replace(MARKER, (m, k) => keys.has(k) ? valueOf(k) : m)).join('\n')
}
async function post(path, body, signal) {
  let res
  try {
    res = await fetch(path + location.search, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal })
  } catch (e) {
    if (e.name === 'AbortError') throw e
    throw new Error('サーバーに接続できませんでした')
  }
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || `サーバーがエラーを返しました (${res.status})`)
  return data
}
async function remoteCompose(text, decisions, quote, assumptions) {
  const draft = await post('/draft', { text, assumptions, quote })
  const blanks = Object.fromEntries(draft.blanks.map(b => [b.key, { label: b.label, q: b.question, type: 'chips', options: b.options, multi: b.multiple, hint: b.multiple ? '複数可' : null }]))
  const keys = new Set(Object.keys(blanks))
  return {
    who: { claude: 'Claude', codex: 'Codex' }[draft.host] || 'AI',
    blanks,
    part1: () => blocksToTokens(draft.blocks, keys, 'blank'),
    async part2(v, signal) {
      const valueOf = k => fmt(blanks[k], v[k])
      const filled = [...keys].map(key => ({ key, label: blanks[key].label, value: valueOf(key) }))
      const cont = await post('/continue', { text, assumptions, quote, draft: blocksToText(draft.blocks, keys, valueOf), filled }, signal)
      return blocksToTokens(cont.blocks, keys, 'ref')
    },
  }
}

/* ============ ボード ============ */
const viewport = $('#viewport'), world = $('#world'), linksSvg = $('#links')
const pan = { x: 0, y: 0 }
const items = []   // {id, kind, x, y, el, ...}
const links = []   // {from, to, dashed}
let seq = 0

function applyPan() {
  world.style.transform = `translate(${pan.x}px,${pan.y}px)`
  viewport.style.backgroundPosition = `${pan.x}px ${pan.y}px`
  closePop(); hideAsk(); scheduleMarkers()
}
viewport.addEventListener('pointerdown', e => {
  if (e.button !== 0 || (e.target !== viewport && e.target !== world)) return
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur()
  viewport.setPointerCapture(e.pointerId); viewport.classList.add('panning')
  const sx = e.clientX - pan.x, sy = e.clientY - pan.y
  const move = m => { pan.x = m.clientX - sx; pan.y = m.clientY - sy; applyPan() }
  viewport.addEventListener('pointermove', move)
  viewport.addEventListener('lostpointercapture', () => { viewport.removeEventListener('pointermove', move); viewport.classList.remove('panning') }, { once: true })
})
window.addEventListener('wheel', e => {
  if (e.target.closest('#pop')) return
  e.preventDefault(); pan.x -= e.deltaX; pan.y -= e.deltaY; applyPan()
}, { passive: false })

function draggable(item, handleTest) {
  item.el.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !handleTest(e.target)) return
    e.preventDefault()
    item.el.setPointerCapture(e.pointerId)
    items.forEach(it => it.el.classList.remove('lifted')); item.el.classList.add('lifted', 'dragging')
    const sx = e.clientX - item.x, sy = e.clientY - item.y
    const move = m => { item.x = m.clientX - sx; item.y = m.clientY - sy; place(item) }
    item.el.addEventListener('pointermove', move)
    item.el.addEventListener('lostpointercapture', () => { item.el.removeEventListener('pointermove', move); item.el.classList.remove('dragging') }, { once: true })
  })
}
// 返事が伸びて下の返事に重なったら、下の返事を押し下げる。人の付箋は動かさない
function pushDown(src) {
  const s = rectOf(src)
  for (const it of items) {
    if (it === src || it.kind !== 'card' || it.el.classList.contains('dragging')) continue
    const o = rectOf(it)
    const hOverlap = s.x < o.x + o.w && s.x + s.w > o.x
    if (hOverlap && o.y >= s.y && o.y < s.y + s.h + 28) { it.y = s.y + s.h + 28; place(it); pushDown(it) }
  }
}
function place(item) { item.el.style.left = item.x + 'px'; item.el.style.top = item.y + 'px'; scheduleLinks(); scheduleMarkers() }
function rectOf(item) { return { x: item.x, y: item.y, w: item.el.offsetWidth, h: item.el.offsetHeight } }
const ro = new ResizeObserver(entries => {
  for (const e of entries) { const it = items.find(i => i.el === e.target); if (it?.kind === 'card') pushDown(it) }
  scheduleLinks(); scheduleMarkers()
})
function addItem(item) { item.id = ++seq; item.el.classList.add('item'); world.append(item.el); items.push(item); place(item); ro.observe(item.el); return item }

function overlaps(r, ignore) {
  return items.some(it => {
    if (it === ignore) return false
    const o = rectOf(it), m = 28
    return r.x < o.x + o.w + m && r.x + r.w + m > o.x && r.y < o.y + o.h + m && r.y + r.h + m > o.y
  })
}
// 返事の置き場所：右が空いていれば右、だめなら下、それも埋まっていれば右の列を下へずらす
function placeBeside(src, w, hgt) {
  const s = rectOf(src)
  const right = s.x + s.w + 72
  const cands = [{ x: right, y: s.y }, { x: s.x, y: s.y + s.h + 56 }, { x: right + w + 72, y: s.y }, { x: right + 2 * (w + 72), y: s.y }]
  for (let k = 1; k < 30; k++) cands.push({ x: right, y: s.y + k * 60 })
  for (const c of cands) if (!overlaps({ ...c, w, h: hgt })) return c
  return cands[0]
}
// 新しい付箋は、いま見えている範囲の空いた場所に置く。無ければ全体の下に置いて画面を寄せる
function freeSpot(w, hgt) {
  const left = -pan.x + 40, top = -pan.y + 90
  for (let y = top; y + hgt < -pan.y + innerHeight - 20; y += 40)
    for (let x = left; x + w < -pan.x + innerWidth - 20; x += 60)
      if (!overlaps({ x, y, w, h: hgt })) return { x, y }
  const bottom = Math.max(top, ...items.map(it => it.y + it.el.offsetHeight))
  return { x: left, y: bottom + 60, offscreen: true }
}
function addNoteAt(text) {
  const p = freeSpot(300, text ? 160 : 140)
  const n = createNote({ x: p.x, y: p.y, text })
  if (p.offscreen) panTo(n)
  n.ta.focus({ preventScroll: true }); n.ta.setSelectionRange(n.ta.value.length, n.ta.value.length)
  return n
}

let linksQueued = false
function scheduleLinks() { if (!linksQueued) { linksQueued = true; requestAnimationFrame(drawLinks) } }
function drawLinks() {
  linksQueued = false
  linksSvg.innerHTML = ''
  for (const l of links) {
    const a = rectOf(l.from), b = rectOf(l.to)
    let d
    if (b.x >= a.x + a.w - 10) {
      const x1 = a.x + a.w, y1 = a.y + Math.min(30, a.h / 2), x2 = b.x, y2 = b.y + 22, dx = Math.max(30, (x2 - x1) / 2)
      d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`
    } else {
      const x1 = a.x + 40, y1 = a.y + a.h, x2 = b.x + 40, y2 = b.y, dy = Math.max(24, (y2 - y1) / 2)
      d = `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`
    }
    const live = (l.to.kind === 'card' && l.to.busy) || (l.from.kind === 'card' && l.from.busy)
    linksSvg.append(Object.assign(document.createElementNS('http://www.w3.org/2000/svg', 'path'), {}))
    const p = linksSvg.lastChild
    p.setAttribute('d', d); p.setAttribute('class', (l.dashed ? 'dashed ' : '') + (live ? 'live' : ''))
  }
}

const pop = $('#pop')
let popCtx = null   // { anchor, note }。note はそのポップオーバーを開いている付箋 (返事の空欄なら null)
function openPop(anchor, sections, get, set, note = null) {
  hidePop()   // 開き直すだけなので、待たせている解析し直しは流さない。anchor が作り直されてしまう
  const ctx = popCtx = { anchor, note }
  pop.innerHTML = ''
  for (const sec of sections) {
    const now = sec.type === 'range' ? h('span', { class: 'now' }, fmt(sec, get(sec.key))) : null
    const block = h('section', {}, h('div', { class: 'q' }, sec.q, sec.hint ? h('span', { class: 'hint' }, sec.hint) : null, now))
    block.append(WIDGETS[sec.type](sec, () => get(sec.key), (v, opt = {}) => {
      set(sec.key, v)
      if (now) now.textContent = fmt(sec, v)
      // 閉じるまでの間に別の空欄を開いていたら、そちらは閉じない
      if (opt.close) setTimeout(() => { if (popCtx === ctx) closePop() }, opt.delay || 120)
    }))
    pop.append(block)
  }
  pop.hidden = false
  const r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight
  let left = Math.min(Math.max(12, r.left - 8), innerWidth - pw - 12)
  let top = r.bottom + 8
  if (top + ph > innerHeight - 12) top = Math.max(12, r.top - ph - 8)
  pop.style.left = left + 'px'; pop.style.top = top + 'px'
  flushRefresh()
}
function hidePop() { if (!pop.hidden) { pop.hidden = true; pop.innerHTML = ''; popCtx = null } }
function closePop() { hidePop(); flushRefresh() }

// 辞書や在庫が届いたとき、書きかけの付箋を解析し直す。変換中の付箋は確定後の解析に任せる。
// ポップオーバーが開いている付箋は、選んでいる最中に問いが変わらないよう、閉じるまで待たせる
const refreshLater = new Set()
function flushRefresh() {
  for (const note of refreshLater) {
    if (popCtx?.note === note) continue
    refreshLater.delete(note)
    if (!note.sent && !note.composing) analyzeNote(note)
  }
}
function refreshNotes() {
  for (const it of items) if (it.kind === 'note' && !it.sent && !it.composing) refreshLater.add(it)
  flushRefresh()
}
// ポップオーバー内のボタンを押しても、付箋のキャレットを失わない

  if (pop.hidden || pop.contains(e.target) || (popCtx && popCtx.anchor.contains?.(e.target))) return

}, true)

const WIDGETS = {

    const hs = [h('div', { class: 'h', role: 'slider', 'aria-label': '下限' }), h('div', { class: 'h', role: 'slider', 'aria-label': '上限' })]
    const span = sec.max - sec.min
    const draw = v => { const p = v.map(x => (x - sec.min) / span * 100); hs[0].style.left = p[0] + '%'; hs[1].style.left = p[1] + '%'; fill.style.left = p[0] + '%'; fill.style.width = (p[1] - p[0]) + '%' }
    hs.forEach((hd, i) => {
      hd.addEventListener('pointerdown', e => {
        hd.setPointerCapture(e.pointerId)
        const move = m => {
          const rr = r.getBoundingClientRect()
          let x = Math.round(sec.min + Math.min(1, Math.max(0, (m.clientX - rr.left) / rr.width)) * span)
          const v = [...get()]
          v[i] = i === 0 ? Math.min(x, v[1]) : Math.max(x, v[0])
          if (v[i] !== get()[i]) { set(v); draw(v) }
        }

    return h('div', {}, pad, preview)
  },
  // 在庫の range / text。候補は無く、自由入力だけ。unit があれば入力の横に置き、数字で終わる入力には付けて保存する

}

/* ============ 付箋（人） ============ */
function allSections(note) { return note.matches.flatMap(m => m.entry.sections) }
function createNote({ x, y, text = '', quote = null }) {
  const note = { kind: 'note', x, y, decisions: {}, touched: new Set(), matches: [], sent: false, composing: false, quote }
  const ta = h('textarea', { rows: 1, placeholder: quote ? 'ここについて聞きたいこと' : '何を考えますか？', 'aria-label': '付箋' })
  ta.value = text
  const mirror = h('div', { class: 'mirror', 'aria-hidden': 'true' })
  const assume = h('div', { class: 'assume', hidden: true })
  const status = h('span', { class: 'status', role: 'status' })
  const send = h('button', { class: 'send', type: 'button', 'aria-label': '送る', disabled: true }, icon('arrowUp', 16))
  note.el = h('article', { class: 'note' }, h('div', { class: 'grip' }), quote ? h('blockquote', { class: 'quote' }, quote) : null, assume, h('div', { class: 'field' }, mirror, ta), h('div', { class: 'foot' }, status, send))
  Object.assign(note, { ta, mirror, assume, status, sendBtn: send })
  addItem(note)
  draggable(note, t => t.classList.contains('grip') || t === note.el || (t.classList.contains('foot')))

  let timer
  const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px' }
  ta.addEventListener('input', e => {
    grow(); send.disabled = !ta.value.trim()
    // 変換中は下線の位置がずれるので隠し、確定してから解析する
    mirror.classList.add('stale')
    if (e.isComposing) return
    clearTimeout(timer); timer = setTimeout(() => analyzeNote(note), 260)
  })
  ta.addEventListener('compositionstart', () => { note.composing = true; mirror.classList.add('stale') })
  ta.addEventListener('compositionend', () => { note.composing = false; clearTimeout(timer); timer = setTimeout(() => analyzeNote(note), 120) })
  ta.addEventListener('click', () => {
    if (note.sent || ta.selectionStart !== ta.selectionEnd) return
    const pos = ta.selectionStart
    const i = note.matches.findIndex(m => m.start >= 0 && pos >= m.start && pos <= m.end)
    if (i < 0) return
    const span = mirror.querySelector(`[data-i="${i}"]`)
    if (span) openNotePop(note, span, note.matches[i].entry.sections)
  })
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendNote(note) } })
  send.onclick = () => sendNote(note)
  requestAnimationFrame(() => { grow(); send.disabled = !ta.value.trim(); if (text) analyzeNote(note) })
  return note
}
function openNotePop(note, anchor, sections) {
  openPop(anchor, sections, k => note.decisions[k], (k, v) => {
    note.decisions[k] = v; note.touched.add(k); renderMirror(note); renderAssume(note)
  }, note)
}
function analyzeNote(note) {
  note.matches = adapter.analyze(note.ta.value)
  for (const s of allSections(note)) if (s.def !== undefined && !(s.key in note.decisions)) note.decisions[s.key] = s.def
  renderMirror(note); renderAssume(note)
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
function renderMirror(note) {
  const t = note.ta.value; let html = '', i = 0
  note.matches.forEach((m, idx) => {
    if (m.start < 0 || m.start < i) return
    const set = m.entry.sections.some(s => note.touched.has(s.key))
    html += esc(t.slice(i, m.start)) + `<span class="kw${set ? ' set' : ''}" data-i="${idx}">${esc(t.slice(m.start, m.end))}</span>`
    i = m.end
  })
  note.mirror.innerHTML = html + esc(t.slice(i)) + ' '
  note.mirror.classList.remove('stale')
}
// 送る前は、いちばん大きな前提だけを付箋の上に出す。在庫の論点は選ぶまで前提ではないので、決まったものだけ
function renderAssume(note) {
  const m = note.matches.find(m => m.entry.top) || note.matches.find(m => m.entry.sections.every(s => isDecided(note, s)))
  if (!m || note.sent) { note.assume.hidden = true; return }
  const sec = m.entry.sections[0]
  const val = h('button', { class: 'val', type: 'button' }, fmt(sec, note.decisions[sec.key]))
  val.onclick = () => openNotePop(note, val, [sec])
  const changed = note.assume.dataset.key !== sec.key
  note.assume.replaceChildren(icon(m.entry.icon, 14), h('span', {}, sec.say[0], ' ', val, sec.say[1]))
  note.assume.dataset.key = sec.key
  if (changed) { note.assume.style.animation = 'none'; note.assume.offsetHeight; note.assume.style.animation = '' }
  note.assume.hidden = false
}
function setNoteStatus(note, kind, text) { note.status.className = 'status ' + kind; note.status.textContent = text }

function sendNote(note) {
  if (note.sent || !note.ta.value.trim()) return
  analyzeNote(note)
  note.sent = true; note.ta.readOnly = true; note.el.classList.add('sent'); note.assume.hidden = true
  closePop()
  setNoteStatus(note, 'thinking', '考えています')
  const card = createCard(note)
  links.push({ from: note, to: card })
  scheduleLinks()
  runCard(card)
}

/* ============ 返事（AI） ============ */
function createCard(note) {
  const pos = placeBeside(note, 380, 240)
  // gen は part2 の世代。abort はその世代の fetch を止める
  const card = { kind: 'card', x: pos.x, y: pos.y, note, filled: {}, gen: 0, abort: null, part1Done: false, busy: true, attention: false }
  const snippet = note.ta.value.replace(/\s+/g, ' ')
  card.decisionsEl = h('ul', { class: 'decisions', hidden: true })
  card.part1 = h('div', { class: 'part' })
  card.part2 = h('div', { class: 'part' })
  card.skel = h('div', { class: 'skeleton' }, h('i'), h('i'), h('i'))
  card.body = h('div', { class: 'body' }, card.skel, card.part1, card.part2)
  card.foot = h('div', { class: 'cfoot' })
  card.who = h('span', {}, 'AI')
  card.el = h('article', { class: 'card', 'aria-live': 'polite' },
    h('header', {}, icon('sparkles', 14), card.who, h('span', { class: 'from' }, snippet)),
    card.decisionsEl, card.body, card.foot)
  addItem(card)
  draggable(card, t => !!t.closest('header'))
  card.el.addEventListener('pointerenter', () => clearAttention(card))
  return card
}
function setAttention(card) {
  card.attention = true
  card.el.classList.remove('fresh'); card.el.offsetWidth; card.el.classList.add('fresh')
  scheduleMarkers()
}
function clearAttention(card) { if (!card.attention) return; card.attention = false; card.el.classList.remove('fresh'); scheduleMarkers() }

function values(card) { return { ...card.note.decisions, ...card.filled } }
// 失敗はカードの下に出し、「もう一度」で失敗した段階だけやり直す
function failCard(card, error, retry) {
  card.busy = false; scheduleLinks()
  card.skel.remove()
  const again = h('button', { class: 'retry', type: 'button' }, 'もう一度')
  again.onclick = () => { again.disabled = true; retry() }
  card.foot.className = 'cfoot error'
  card.foot.replaceChildren(h('span', {}, error.message), again)
  setNoteStatus(card.note, 'failed', '返事を作れませんでした')
}
async function runCard(card) {
  const note = card.note
  card.busy = true; scheduleLinks()
  card.foot.className = 'cfoot'; card.foot.textContent = ''
  if (!card.skel.isConnected) card.body.prepend(card.skel)
  setNoteStatus(note, 'thinking', '考えています')
  const lines = note.matches.flatMap(m => m.entry.sections.map(s => [m.entry.icon, s])).filter(([, s]) => isDecided(note, s))
  const assumptions = lines.map(([, s]) => s.say[0] + fmt(s, note.decisions[s.key]) + s.say[1])
  try {
    card.plan = await adapter.compose(note.ta.value, note.decisions, note.quote, assumptions)
  } catch (e) { failCard(card, e, () => runCard(card)); return }
  card.skel.remove()
  card.who.textContent = card.plan.who
  if (lines.length) {
    card.decisionsEl.hidden = false
    lines.forEach(([ic, s], i) => card.decisionsEl.append(h('li', { style: `animation-delay:${i * 60}ms` }, icon(ic, 13), h('span', {}, s.say[0], ' ', h('b', {}, fmt(s, note.decisions[s.key])), s.say[1]))))
  }
  setNoteStatus(note, 'arrived', '返事が届きました')
  setAttention(card)
  await streamTokens(card, card.part1, card.plan.part1(values(card)), 0)
  card.part1Done = true
  afterPart1(card)
}
function unfilled(card) { return Object.keys(card.plan.blanks).filter(k => !(k in card.filled)) }
function afterPart1(card) {
  const left = unfilled(card)
  if (left.length) {
    card.busy = false; scheduleLinks()
    card.foot.className = 'cfoot needs'
    card.foot.textContent = left.length === Object.keys(card.plan.blanks).length && left.length > 1
      ? `${left.length}つの空欄を埋めたら続けます` : left.length === 1 ? 'あと1つ埋めたら続けます' : `あと${left.length}つ埋めたら続けます`
    setNoteStatus(card.note, 'needs', `空欄 ${left.length}`)
    if (!card.waitingAnnounced) { card.waitingAnnounced = true; setAttention(card) }
  } else continueCard(card)
}
let contTimers = new WeakMap()
function continueCard(card) {
  clearTimeout(contTimers.get(card))
  // 選び直しの連打を待つ間にも、走っている要求と描画は先に止める
  card.gen++; card.abort?.abort()
  card.foot.className = 'cfoot'; card.foot.textContent = ''
  contTimers.set(card, setTimeout(() => writeContinuation(card), 650))
}
async function writeContinuation(card) {
  const g = ++card.gen
  card.abort?.abort()
  const ac = card.abort = new AbortController()
  card.busy = true; scheduleLinks()
  card.part2.replaceChildren()
  card.foot.className = 'cfoot'; card.foot.textContent = '続きを書いています'
  setNoteStatus(card.note, 'thinking', '続きを書いています')
  let tokens
  try {
    tokens = await card.plan.part2(values(card), ac.signal)
  } catch (e) {
    if (g === card.gen) failCard(card, e, () => writeContinuation(card))
    return
  }
  if (g !== card.gen) return
  await streamTokens(card, card.part2, tokens, g)
  if (g !== card.gen) return
  card.busy = false; scheduleLinks()
  card.foot.textContent = ''
  setNoteStatus(card.note, 'done', '返事あり')
}
function fillBlank(card, key, v) {
  card.filled[key] = v
  for (const b of card.el.querySelectorAll(`.blank[data-key="${key}"]`)) { b.textContent = fmt(card.plan.blanks[key], v); b.classList.add('filled') }
  if (!card.part1Done) return
  if (unfilled(card).length) afterPart1(card)
  else continueCard(card)   // 続きが書かれた後に変えた場合も、そこから書き直す
}

async function streamTokens(card, container, tokens, g) {
  const alive = () => card.gen === g
  const v = values(card)
  for (const tok of tokens) {
    if (!alive()) return
    let el
    if (tok.p) el = h('p')
    else if (tok.h) el = h('h3')
    else if (tok.ul) el = h('ul')
    else if (tok.quote) el = h('blockquote')
    else if (tok.posters) { container.append(renderPosters(v)); await sleep(500); continue }
    container.append(el)
    if (tok.ul) { for (const li of tok.ul) { const l = h('li'); el.append(l); await typeInline(l, li, card, v, alive) } }
    else if (tok.quote) await typeInline(el, [].concat(tok.quote), card, v, alive)
    else await typeInline(el, tok.p || tok.h, card, v, alive)
    await sleep(120)
  }
}
async function typeInline(el, parts, card, v, alive) {
  for (const part of parts) {
    if (!alive()) return
    if (typeof part === 'string') {
      const node = document.createTextNode(''); el.append(node)
      for (let i = 0; i < part.length; i += 3) { if (!alive()) return; node.data = part.slice(0, i + 3); await sleep(32) }
    } else if (part.blank) {
      const spec = card.plan.blanks[part.blank], key = part.blank
      const b = h('button', { class: 'blank', type: 'button', 'data-key': key }, spec.label)
      if (key in card.filled) { b.textContent = fmt(spec, card.filled[key]); b.classList.add('filled') }
      b.onclick = () => openPop(b, [{ ...spec, key }], k => card.filled[k] ?? (spec.type === 'range' ? spec.def : undefined), (k, val) => fillBlank(card, k, val))
      el.append(b); await sleep(260)
    } else if (part.ref) {
      // モデルが付けた空欄のキーは、付箋の前提のキーと重なりうるので、空欄を先に探す
      const sec = [...Object.entries(card.plan.blanks).map(([k, s]) => ({ ...s, key: k })), ...allSections(card.note)].find(s => s.key === part.ref)
      const val = v[part.ref]
      el.append(h('span', { class: 'ref' }, val == null ? '' : sec ? fmt(sec, val) : fmtDefault(val)))
    }
  }
}
function renderPosters(v) {
  const style = v.style || '幾何学的', color = COLORS[v.color] || v.color || '#ef5a3c', theme = v.theme || 'Web', emph = v.title || '大きく'
  const base = { style, color, title: `${theme}勉強会`, emph, sub: '参加無料 / 先着40名' }
  let a = { ...base }, b = { ...base }
  if (v.axis === '想定する読者') { a.sub = 'はじめての人へ'; b.sub = '現場で使っている人へ' }
  else if (v.axis === '載せる内容') { a.sub = '登壇3名 + 懇親会'; b.sub = 'ハンズオン 90分' }
  else b.style = STYLES[(STYLES.indexOf(style) + 1) % STYLES.length]
  return h('div', { class: 'posters' }, h('figure', {}, poster(a), h('figcaption', {}, 'A案')), h('figure', {}, poster(b), h('figcaption', {}, 'B案')))
}

/* ============ 画面外の返事への目印 ============ */
const markersEl = $('#markers')
let markersQueued = false
function scheduleMarkers() { if (!markersQueued) { markersQueued = true; requestAnimationFrame(drawMarkers) } }
function drawMarkers() {
  markersQueued = false
  markersEl.replaceChildren()
  for (const card of items) {
    if (card.kind !== 'card' || !card.attention) continue
    const r = card.el.getBoundingClientRect()
    // 端に少し見えているだけでは気づけないので、見えている高さが小さければ目印を出す
    const visibleH = Math.min(r.bottom, innerHeight) - Math.max(r.top, 70)
    const visibleW = Math.min(r.right, innerWidth) - Math.max(r.left, 0)
    if (visibleH >= 100 && visibleW >= 120) continue
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2
    const ang = Math.atan2(cy - innerHeight / 2, cx - innerWidth / 2)
    const m = h('button', { class: 'marker', type: 'button' }, h('span', { class: 'ic', style: `transform:rotate(${ang}rad)` }, icon('arrowRight', 14)), h('span', {}, card.note.ta.value.slice(0, 14)))
    markersEl.append(m)
    const mx = Math.min(innerWidth - m.offsetWidth - 16, Math.max(16, cx - m.offsetWidth / 2))
    const my = Math.min(innerHeight - m.offsetHeight - 16, Math.max(72, cy - m.offsetHeight / 2))
    m.style.left = mx + 'px'; m.style.top = my + 'px'
    m.onclick = () => panTo(card)
  }
}
function panTo(item) {
  const r = rectOf(item)
  const tx = innerWidth / 2 - (r.x + r.w / 2), ty = innerHeight / 2 - (r.y + Math.min(r.h, innerHeight - 160) / 2)
  const sx = pan.x, sy = pan.y, t0 = performance.now()
  const step = t => {
    const k = Math.min(1, (t - t0) / 380), e = 1 - Math.pow(1 - k, 3)
    pan.x = sx + (tx - sx) * e; pan.y = sy + (ty - sy) * e; applyPan()
    if (k < 1) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}
window.addEventListener('resize', scheduleMarkers)

// empty / failed でもボードはそのまま動くので、何も出さずにやめる。file:// の見本には在庫が無い
async function pollInventory() {
  for (;;) {
    let r
    try {
      const res = await fetch('/inventory' + location.search)
      if (!res.ok) return
      r = await res.json()
    } catch { return }
    if (r.state === 'pending') { await sleep(2000); continue }
    console.info(`[inventory] ${r.state}`)
    if (r.state === 'ready') { inventory = r.inventory; refreshNotes() }
    return
  }
}
if (location.protocol !== 'file:') pollInventory()

createNote({ x: Math.max(40, innerWidth * 0.08), y: 120, text: EXAMPLES.travel })
