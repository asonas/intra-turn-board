<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intra-turn Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f6f6f7; --dot:#00000014; --paper:#fbfaf6;
  --surface:#ffffff; --surface-2:#f2f2f4; --surface-3:#e8e8eb;
  --line:#00000017; --line-strong:#00000026;
  --ink:#1a1a1e; --sub:#5c5d65; --faint:#9a9ba3;
  --accent:#3a5bd9; --accent-soft:#3a5bd914; --accent-line:#3a5bd966;
  --send-bg:#1a1a1e; --send-ink:#ffffff; --send-off:#e6e6e9; --send-off-ink:#a6a7ae;
  --link:#00000038; --hl:#3a5bd91c; --hl-pick:#3a5bd930;
  --danger:#c2410c;
  --shadow:0 1px 2px #0000000a,0 6px 20px #0000000d;
  --shadow-pop:0 2px 6px #00000010,0 18px 48px #0000001c;
  --font:"Inter","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#131315; --dot:#ffffff12; --paper:#17171a;
    --surface:#1b1b1e; --surface-2:#242428; --surface-3:#2e2e33;
    --line:#ffffff0f; --line-strong:#ffffff1c;
    --ink:#ececef; --sub:#a1a1a9; --faint:#6d6d76;
    --accent:#7c97ff; --accent-soft:#7c97ff1a; --accent-line:#7c97ff70;
    --send-bg:#ececef; --send-ink:#131315; --send-off:#2e2e33; --send-off-ink:#6d6d76;
    --link:#ffffff2e; --hl:#7c97ff24; --hl-pick:#7c97ff3d;
    --danger:#f0835a;
    --shadow:0 1px 2px #00000040,0 8px 28px #00000050;
    --shadow-pop:0 2px 6px #00000050,0 18px 48px #00000080;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;font:14px/1.7 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}

/* canvas */
#viewport{position:fixed;inset:0;touch-action:none}
#dots{position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:24px 24px;pointer-events:none;transition:opacity .7s ease}
body.hero #dots{opacity:0}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#links path{fill:none;stroke:var(--link);stroke-width:1.25;transition:stroke .3s}
#links path.live{stroke:var(--accent-line)}
#links circle{fill:var(--link)}
#links circle.live{fill:var(--accent-line)}

/* hero (empty state) */
#hero{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 16px 14vh;z-index:10;pointer-events:none}
#hero>*{pointer-events:auto}
body:not(.hero) #hero>*{pointer-events:none}

/* composer */
.composer{position:relative;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"atts atts atts" "field field field" "attach . send";align-items:center;background:var(--surface-2);border-radius:12px;transition:box-shadow .15s}
.composer.compact{grid-template-areas:"atts atts atts" "attach field send";align-items:end;padding:5px;column-gap:2px;--fs:14px;--lh:1.65}
.composer.hero{width:min(640px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:22px;padding:14px 10px 10px 18px;box-shadow:var(--shadow);--fs:16px;--lh:1.7}
.composer.over{box-shadow:0 0 0 2px var(--accent-line)}
.composer .tools{display:contents}
.composer .main{grid-area:field;min-width:0}
.composer.compact .main{padding:3px 4px}
.composer.hero .main{padding:2px 8px 10px 0;min-height:64px}
.composer .attach{grid-area:attach}
.composer .send{grid-area:send}
.composer.hero .attach{margin-left:-8px}
.atts{grid-area:atts;display:flex;gap:6px;padding:2px 0 8px}
.compact .atts{padding:2px 2px 6px}
.att{position:relative;width:44px;height:44px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);background:var(--surface-3)}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att button{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;border:0;padding:0;background:#000000a0;color:#fff;display:flex;align-items:center;justify-content:center}
.field{position:relative}
.field .mirror,.field textarea{font:inherit;font-size:var(--fs);line-height:var(--lh);letter-spacing:normal;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;padding:0;margin:0;border:0}
.field .mirror{position:absolute;inset:0;color:transparent;pointer-events:none;overflow:hidden;transition:opacity .15s}
.field .mirror.stale{opacity:0}
.field .kw{border-radius:3px;background:var(--accent-soft);text-decoration:underline dotted var(--accent);text-decoration-thickness:1.5px;text-underline-offset:5px}
.field .kw.set{text-decoration-style:solid}
.field textarea{position:relative;display:block;width:100%;background:transparent;resize:none;outline:none;overflow:hidden;color:var(--ink);caret-color:var(--accent)}
.field textarea::placeholder{color:var(--faint)}
.ib{width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib:hover{background:var(--surface-3);color:var(--ink)}
.hero .ib{width:32px;height:32px;border-radius:10px}
.send{width:28px;height:28px;border-radius:50%;border:0;padding:0;background:var(--send-bg);color:var(--send-ink);display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.send:disabled{background:var(--send-off);color:var(--send-off-ink);cursor:default}
.hero .send{width:32px;height:32px}

/* block */
.block{position:absolute;left:0;top:0;width:460px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 14px 12px;outline:2px solid transparent;outline-offset:3px;transition:background-color .3s,border-color .3s,box-shadow .3s;cursor:grab;
  --pele-bg:var(--surface);--pele-fg:var(--ink);--pele-muted:var(--sub);--pele-line:var(--sub);--pele-surface:var(--surface-2);--pele-surface-alt:var(--surface-3);--pele-border:var(--line-strong);--pele-accent:var(--accent);--pele-radius:8px}
.block.draft{width:400px;background:transparent;border-color:transparent;box-shadow:none;padding:0}
.block.draft.lead{width:460px}
.block.lead .composer.hero{width:auto}
.block.draft .composer:not(.hero){background:var(--surface);box-shadow:0 0 0 1px var(--line-strong),var(--shadow)}
.block .composer{margin-top:14px;cursor:auto}
.block.draft .composer{margin-top:0}
.block.fresh{animation:ring 1.6s ease-out}
.block .text,.block .bubble{cursor:text}
.block .text.onquote{cursor:pointer}
.block.dragging{box-shadow:var(--shadow-pop)}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.quoteline{font-size:12.5px;line-height:1.6;color:var(--sub);border-left:2px solid var(--accent-line);padding:0 0 0 10px;margin:2px 4px 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.quoteline:hover{color:var(--ink)}
.quoteline.thumb{display:block;line-height:0}
.quoteline.thumb img,.quoteline.thumb svg{display:inline-block;max-height:52px;max-width:140px;width:auto;height:auto;border-radius:6px;box-shadow:0 0 0 1px var(--line);vertical-align:top}
.quoteline.thumb:hover img,.quoteline.thumb:hover svg{box-shadow:0 0 0 1px var(--accent-line)}
/* 前提: 呼び出し元の会話から作る素材。入力欄も影もなく、紙のように左に置く */
.block.premise{width:440px;background:var(--paper);border-color:var(--line);border-radius:10px;box-shadow:none;padding:20px 24px 18px}
.block.premise .msg.ai{padding:0}
.block.premise .text h3{font-size:15px;margin:18px 0 4px}
.block.premise .text h3:first-child{margin-top:0}
.block.premise .text li{margin:3px 0}
.msg+.msg{margin-top:16px}
.msg{animation:rise .28s ease-out both}
.msg.user{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bubble{max-width:85%;background:var(--surface-2);border-radius:12px;padding:5px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{padding:0 4px}
.assumed{list-style:none;margin:0 0 8px;padding:0;font-size:12.5px;line-height:1.8;color:var(--faint);display:flex;flex-wrap:wrap;gap:0 14px}
.assumed li{display:inline-flex;gap:5px;align-items:center}
.assumed b{font-weight:500;color:var(--sub)}
.text p{margin:0 0 8px}
.text h3{font-size:14px;font-weight:600;margin:12px 0 2px}
.text h3:first-child{margin-top:0}
.text ul{margin:0 0 8px;padding-left:1.15em}
.text li{margin:1px 0}
.text li::marker{color:var(--faint)}
.text blockquote{margin:4px 0 8px;padding:6px 12px;background:var(--surface-2);border-radius:8px}
.text pre{margin:4px 0 8px;padding:8px 10px;background:var(--surface-2);border-radius:8px;font:12px/1.6 var(--mono);overflow:auto}
.text>:last-child{margin-bottom:0}
.text:empty{display:none}
.text.more:not(:empty){margin-top:8px}
.text>*{animation:fadein .25s ease-out}
.status{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:6px;min-height:0}
.status:not(:empty){margin-top:6px}
.status.needs{color:var(--accent)}
.status.failed{color:var(--danger)}
.status .retry{border:1px solid currentColor;background:transparent;border-radius:999px;padding:0 10px;font-size:12px;line-height:20px;color:inherit}
.shimmer{background:linear-gradient(90deg,var(--faint) 0%,var(--faint) 35%,var(--ink) 50%,var(--faint) 65%,var(--faint) 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.8s linear infinite}
.status .spark{color:var(--faint)}
.blank{border:0;background:var(--accent-soft);border-radius:4px;padding:0 5px;margin:0 1px;font:inherit;color:var(--accent);box-shadow:inset 0 -1.5px 0 var(--accent-line);animation:blankin .5s ease-out}
.blank:hover{background:var(--hl-pick)}
.blank.filled{background:transparent;color:var(--ink);padding:0;margin:0;box-shadow:inset 0 -1.5px 0 var(--accent)}
.ref{text-decoration:underline solid var(--accent-line);text-decoration-thickness:1.5px;text-underline-offset:4px}
/* 本文の中の画像と図。幅は本文の幅まで、高さは MEDIA_MAX_H まで縮める。押すとそれについて聞ける */
.media{margin:6px 0 10px;width:fit-content;max-width:100%;border-radius:10px;outline:2px solid transparent;outline-offset:3px;transition:outline-color .15s;user-select:none;-webkit-user-select:none}
.media.ready{cursor:pointer}
.media.ready:hover{outline-color:var(--accent-line)}
.media.quoted{outline-color:var(--hl-pick)}
.media.picking,.media.flash{outline-color:var(--accent)}
.media img{display:block;max-width:100%;max-height:360px;border-radius:10px;animation:fadein .3s ease-out}
.media svg{display:block;animation:fadein .3s ease-out}
.media .ph{width:340px;max-width:100%;height:204px;border-radius:10px;background:linear-gradient(90deg,var(--surface-2) 0,var(--surface-3) 40%,var(--surface-2) 80%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
.media .src{margin:0;padding:8px 10px;border-radius:8px;background:var(--surface-2);font:12px/1.65 var(--mono);color:var(--faint);white-space:pre;overflow:hidden;user-select:text;-webkit-user-select:text}
.media.repairing .src{animation:blink 1.1s infinite}
.media .err{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.6;color:var(--danger);margin:0 0 6px}
.media .err .ic{margin-top:3px}
.media pre.code{margin:0;padding:8px 10px;overflow:auto;background:var(--surface-2);border-radius:8px;font:12px/1.65 var(--mono);color:var(--ink);white-space:pre;user-select:text;-webkit-user-select:text}
.msg.user .media{margin:0}
.msg.user .media img{max-width:280px;max-height:280px}

/* popover */
#pop{position:fixed;z-index:40;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow-pop);padding:10px;min-width:220px;max-width:340px;animation:popin .14s ease-out;transform-origin:top left}
#pop section+section{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
#pop .q{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--sub);margin:0 4px 6px}
#pop .q .hint{color:var(--faint)}
#pop .q .now{margin-left:auto;font-weight:600;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:1px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;border:0;background:none;text-align:left;padding:5px 8px;border-radius:8px;font-size:13.5px}
.opt:hover{background:var(--surface-2)}
.opt .ic{color:var(--accent)}
.chipset{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:2px 11px;font-size:13px;color:var(--ink)}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.other{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;border-radius:8px;padding:4px 8px;font-size:12.5px;color:var(--faint);margin-top:6px}
.other:hover{color:var(--ink);background:var(--surface-2)}
.other-input{margin-top:6px;width:100%;font:inherit;font-size:13px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:5px 10px;outline:none}
.other-input:focus{border-color:var(--accent)}
.map{position:relative;height:170px;width:280px;border-radius:10px;background-color:var(--surface-2);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:10px 10px}
.map .chip{position:absolute;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;background:var(--surface)}
.map .chip.on{background:var(--ink)}
.map .chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.range{position:relative;height:28px;margin:0 10px;width:240px;touch-action:none}
.range .track{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--surface-3)}
.range .fill{position:absolute;top:12px;height:4px;border-radius:2px;background:var(--ink)}
.range .h{position:absolute;top:5px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--line-strong),0 1px 3px #0003;cursor:grab;touch-action:none}

/* selection pill */
#pill{position:fixed;z-index:35;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;box-shadow:var(--shadow-pop);padding:4px 4px 4px 14px;animation:popin .12s ease-out}
#pill input{border:0;outline:none;background:transparent;font:inherit;font-size:13px;color:var(--ink);width:200px;padding:0}
#pill input::placeholder{color:var(--faint)}
#pill .send{width:26px;height:26px}
::highlight(picking){background-color:var(--hl-pick)}
::highlight(quoted){background-color:var(--hl)}
::highlight(quoted-hover),::highlight(quote-flash){background-color:var(--hl-pick)}

#zoom{position:fixed;right:16px;bottom:16px;z-index:20;border:1px solid var(--line);background:var(--surface);color:var(--sub);border-radius:8px;padding:2px 10px;font-size:12px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}

/* hero -> block morph */
.ghost-shell{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);pointer-events:none}
.ghost-text{position:fixed;z-index:31;pointer-events:none;white-space:pre-wrap;color:var(--ink);transform-origin:0 0}

@keyframes rise{from{opacity:0;transform:translateY(4px)}}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{opacity:0;transform:scale(.97)}}
@keyframes blink{50%{opacity:.3}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-200% 0}}
@keyframes ring{0%{outline-color:var(--accent-line)}100%{outline-color:transparent}}
@keyframes blankin{0%{background:var(--hl-pick)}100%{background:var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="hero">
<div id="viewport"><div id="dots"></div><div id="world"><svg id="links"></svg></div></div>
<div id="hero"></div>
<div id="pop" hidden></div>
<div id="pill" hidden><input aria-label="ここについて聞く" placeholder="ここについて聞く"><button type="button" class="send go" aria-label="送る" disabled></button></div>
<button id="zoom" type="button" hidden></button>

<script>
'use strict'
/* ============ 小道具 ============ */
const $ = (s, r = document) => r.querySelector(s)
const params = new URLSearchParams(location.search)
const FAST = params.has('fast')
const T = ms => FAST ? ms * 0.25 : ms
const sleep = ms => new Promise(r => setTimeout(r, T(ms)))
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue
    if (k === 'class') el.className = v
    else if (k === 'style') el.style.cssText = v
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else el.setAttribute(k, v === true ? '' : v)
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k))
  return el
}
// Lucide (ISC)
const ICONS = {
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  arrowUp: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  chevronDown: '<path d="m6 9 6 6 6-6"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  list: '<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
  calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  mapPin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
  tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>',
  layout: '<rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/>',
  messageQ: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  workflow: '<rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
}
function icon(name, size = 16) {
  const s = h('span', { class: 'ic' })
  s.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`
  return s
}
const fmtDefault = v => Array.isArray(v) ? v.join('と') : String(v)
const fmt = (sec, v) => (sec?.fmt || fmtDefault)(v)
const optV = o => typeof o === 'string' ? o : o.v
const short = (t, n = 18) => t.length > n ? t.slice(0, n) + '…' : t

/* ============ 盤面のデータ ============
   Thread  = { id, n, kind: 'chat' | 'premise', pos: { x, y }, origin: { threadId, msgIndex, quote: Quote } | null, lead,
               anchor?, messages: Message[], composer: Composer | null }
             pos は作るときに一度だけ決め、以後は人のドラッグだけが変える。伸びても、ほかが伸びても、決め直さない
             lead は前提の隣で始めた会話。空のまま離れても消さない
   Quote   = { kind: 'text', text } | { kind: 'image', key, src, alt } | { kind: 'diagram', key, svg, source }
             画像と図は、聞いた時点の見た目を写して持つ。続きを書き直しても、追い質問の引用は変わらない
   Message = { role: 'user', parts: [{ text }], images: [{ src }], decisions, assumptions }
           | { role: 'ai', phase, blanks, filled, parts: Token[], more: Token[], decisions, assumptions }
             phase: thinking → drafting → waiting ⇄ continuing → done (done → continuing は選び直し)
   Token   = { p | h: Inline[] } | { ul: Inline[][] } | { quote: Inline[] } | { fence: lang, source, closed } | { image, alt }
   Inline  = 文字列 | { blank: key } | { ref: key }
   画像と図は発言の中に描く。key は「スレッド:発言:何番目か」で、聞いたときの引用と線の起点がこれで元を探す
   Composer = { text, decisions, touched, attachments: [{ id, src }] }
   線は origin から毎回引く。どこにも保存しない */
const state = { threads: [], view: { x: 0, y: 0, z: 1 }, mode: 'hero' }
let seq = 0
const ui = new Map()            // thread の id → { el, msgs, msgEls, comp, quoteEl }
const newComposer = () => ({ text: '', decisions: {}, touched: new Set(), attachments: [] })
function newThread({ pos = null, origin = null, lead = false, kind = 'chat' }) {
  const t = { id: 't' + (++seq), n: seq, kind, pos, origin, lead, messages: [], composer: kind === 'premise' ? null : newComposer() }
  state.threads.push(t)
  return t
}
const threadOf = id => state.threads.find(t => t.id === id)

  { id: 'name', words: ['名前', 'ネーミング'], icon: 'tag', sections: [

  { id: 'app', words: ['アプリ'], icon: 'layout', sections: [
    { key: 'kind', q: 'どんなアプリ？', type: 'chips', options: ['付箋ボード', 'メモ', '家計簿', '学習'], def: '付箋ボード', say: ['アプリは', ''] }] },
]
const SECTION = Object.fromEntries(LEXICON.flatMap(e => e.sections.map(s => [s.key, s])))

function analyze(text) {
  const hits = []
  for (const e of LEXICON) {
    let best = null
    for (const w of e.words) { const i = text.indexOf(w); if (i >= 0 && (!best || i < best.start)) best = { start: i, end: i + w.length } }
    if (best) hits.push({ ...best, entry: e })
  }
  hits.sort((a, b) => a.start - b.start)
  const out = []; let last = -1
  for (const m of hits) { if (m.start < last) continue; out.push(m); last = m.end }
  return out
}

const stopName = s => s.split(/から|で|の|を/)[0].slice(0, 7)
function routeMap(stops) {
  const W = 340, H = 204, n = stops.length
  const pts = stops.map((s, k) => ({ x: 44 + (n === 1 ? 126 : k * 252 / (n - 1)), y: 112 - Math.sin(k / Math.max(1, n - 1) * Math.PI) * 46 + (k % 2 ? 16 : -4), s }))
  const route = pts.map((p, k) => (k ? 'L' : 'M') + p.x.toFixed(0) + ' ' + p.y.toFixed(0)).join(' ')
  const grid = Array.from({ length: 8 }, (_, k) => `<path d="M${k * 48} 0V${H}M0 ${k * 32}H${W}"/>`).join('')
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="${W}" height="${H}" fill="#efece4"/><g stroke="#e2ddd1" stroke-width="1">${grid}</g>
<path d="M-10 176 C 70 150, 150 198, 230 166 S 330 128, 360 142" fill="none" stroke="#c4d7e2" stroke-width="12" stroke-linecap="round"/>
<path d="${route}" fill="none" stroke="#3b4454" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"/>
${pts.map((p, k) => `<circle cx="${p.x}" cy="${p.y}" r="9" fill="#d9553a"/><text x="${p.x}" y="${p.y + 3.6}" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">${k + 1}</text><text x="${p.x}" y="${p.y + 24}" font-size="10.5" fill="#3b4454" text-anchor="middle">${stopName(p.s)}</text>`).join('')}
</svg>`
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg)
}

    draft: () => ['付箋から返事までを流れ図にすると、こうなります。', '```mermaid', 'flowchart LR', '  入力[書く --> 解析[下線を引く]', '  解析 --> 送る', '  送る --> 返事[返事が届く]', '```'].join('\n'),

    blanks: {},

function pickScript({ thread, text, images, premise }) {
  if (premise) return SCRIPTS.premise(premise)
  const asked = thread.messages.filter(m => m.role === 'user').length
  if (thread.origin && asked === 1) return SCRIPTS.aboutQuote(thread.origin.quote, threadOf(thread.origin.threadId)?.kind, text)
  if (asked > 1 || thread.origin) return /フロー|流れ図/.test(text) ? SCRIPTS.brokenFlow() : SCRIPTS.followUp(text)
  if (/京都|旅行/.test(text)) return SCRIPTS.travel()
  if (/状態図|流れ/.test(text)) return SCRIPTS.flow()
  if (/名前|ネーミング/.test(text)) return SCRIPTS.naming()
  if (images) return SCRIPTS.image()
  return SCRIPTS.generic(text)
}

// Markdown → Token[]。閉じていないコードブロックは closed: false のまま返す (描かずにソースを見せる)
const MARKER = /\[\[([a-z][a-z0-9_]{0,31})\]\]/g
function inlineParts(text, blankKeys) {
  const out = []; let i = 0
  for (const m of text.matchAll(MARKER)) {
    if (m.index > i) out.push(text.slice(i, m.index))
    out.push(blankKeys.has(m[1]) ? { blank: m[1] } : { ref: m[1] }); i = m.index + m[0].length
  }
  if (i < text.length) out.push(text.slice(i))
  return out
}
function mdToTokens(md, blankKeys = new Set()) {
  const out = [], lines = md.split('\n')
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i]
    const fence = L.match(/^```\s*([\w-]*)\s*$/)
    if (fence) {
      const body = []; let closed = false
      for (i++; i < lines.length; i++) { if (/^```\s*$/.test(lines[i])) { closed = true; break } body.push(lines[i]) }
      out.push({ fence: fence[1] || '', source: body.join('\n'), closed })
      continue
    }
    const img = L.match(/^!\[([^\]]*)\]\((.+)\)\s*$/)
    if (img) out.push({ image: img[2], alt: img[1] })
    else if (L.startsWith('## ')) out.push({ h: inlineParts(L.slice(3), blankKeys) })
    else if (L.startsWith('- ')) { const last = out.at(-1); const li = inlineParts(L.slice(2), blankKeys); if (last?.ul) last.ul.push(li); else out.push({ ul: [li] }) }
    else if (L.startsWith('> ')) out.push({ quote: inlineParts(L.slice(2), blankKeys) })
    else if (L.trim()) out.push({ p: inlineParts(L, blankKeys) })
  }
  return out
}

/* ============ 生成元のつなぎ目 ============
   UI が知っているのは adapter だけ。
   analyze(text) → 下線の一覧。reply(ctx) → Plan = { blanks, draft(values) → Token[], more: ((values, signal) → Promise<Token[]>) | null }
   repairDiagram({ source, error }) → Promise<直した Mermaid>。描けなかった図を一度だけ AI に直させる
   本番では reply を server.mjs の /draft と /continue に、analyze を Kuromoji + /judge + /inventory に、
   repairDiagram を「ソースとエラーを渡して直したコードブロックだけを返させる」呼び出しに差し替える。
   前提は reply に ctx.premise (スキルの引数) を渡して作る。本番では呼び出し元の会話から作る。
   追い質問の ctx.quote は Quote。サーバーへは quoteText で文字にして渡す (図は Mermaid のソース、画像は代わりの文)。
   まとめ (/summary) は state.threads をそのまま読めばよい */
async function scriptedReply(ctx) {
  await sleep(1500 + Math.random() * 900)
  const s = pickScript(ctx)
  const keys = new Set(Object.keys(s.blanks))
  return {
    blanks: s.blanks,
    draft: v => mdToTokens(s.draft(v), keys),
    more: s.more ? async v => { await sleep(500); return mdToTokens(s.more(v)) } : null,
  }
}
// server.mjs の Draft {blocks, blanks} と Continuation {blocks} を Plan にする。試作では使わない
async function post(path, body, signal) {
  const res = await fetch(path + location.search, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal })
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || `サーバーがエラーを返しました (${res.status})`)
  return data
}
const blocksToMd = blocks => blocks.map(b => ({ heading: '## ', item: '- ', quote: '> ' }[b.kind] || '') + b.text).join('\n')
const quoteText = q => !q ? null : q.kind === 'text' ? q.text : q.kind === 'diagram' ? '```mermaid\n' + q.source + '\n```' : `[画像] ${q.alt || ''}`
async function remoteReply({ text, quote: q, assumptions }) {
  const quote = quoteText(q)
  const d = await post('/draft', { text, assumptions, quote })
  const blanks = Object.fromEntries(d.blanks.map(b => [b.key, { label: b.label, q: b.question, type: 'chips', options: b.options, multi: b.multiple }]))
  const keys = new Set(Object.keys(blanks))
  return {
    blanks,
    draft: () => mdToTokens(blocksToMd(d.blocks), keys),
    more: async (v, signal) => {
      const filled = [...keys].map(key => ({ key, label: blanks[key].label, value: fmt(blanks[key], v[key]) }))
      const c = await post('/continue', { text, assumptions, quote, draft: blocksToMd(d.blocks).replace(MARKER, (m, k) => keys.has(k) ? fmt(blanks[k], v[k]) : m), filled }, signal)
      return mdToTokens(blocksToMd(c.blocks))
    },
  }
}
// 試作の AI は、閉じ忘れた [ を閉じるだけ直す。?repair=fail で直せなかった場合を試せる
let repairCalls = 0
async function scriptedRepair({ source }) {
  repairCalls++
  await sleep(1200)
  if (params.get('repair') === 'fail') return source
  return source.split('\n').map(l => l.replace(/\[([^[\]]*?)\s+(-->|---)/g, '[$1] $2')).join('\n')
}

const viewport = $('#viewport'), world = $('#world'), linksSvg = $('#links'), dots = $('#dots'), zoomBtn = $('#zoom')
const view = state.view
const toWorld = (sx, sy) => ({ x: (sx - view.x) / view.z, y: (sy - view.y) / view.z })
function applyView() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`
  dots.style.backgroundSize = `${24 * view.z}px ${24 * view.z}px`

let viewAnim = 0
function animateView(to, ms = 380) {
  const from = { ...view }, t0 = performance.now(), id = ++viewAnim

    if (id !== viewAnim) return

    view.x = from.x + (to.x - from.x) * e; view.y = from.y + (to.y - from.y) * e; view.z = from.z + (to.z - from.z) * e
    applyView()

  }

}
// 引用とその追い質問を行き来する。収まらないときだけ縮める
function centerOn(r, pad = 48) {

// 人が送った追い質問の頭 (引用、問い、考えている行) が画面の外にかかったときだけ呼ぶ。ブロックは動かさず、視点を最小限ずらす。
// 元の一節や図 (keep、画面座標) は画面から追い出さない。返事が届いたことやブロックが伸びたことでは、視点は動かさない
const PAD = 32
const screenRect = () => ({ x: (PAD - view.x) / view.z, y: (PAD - view.y) / view.z, w: (innerWidth - 2 * PAD) / view.z, h: (innerHeight - 2 * PAD) / view.z })
function reveal(r, keep) {
  const sx = r.x * view.z + view.x, sy = r.y * view.z + view.y, sw = r.w * view.z, sh = Math.min(r.h * view.z, innerHeight - 2 * PAD)
  let dx = 0, dy = 0
  if (sx + sw > innerWidth - PAD) dx = innerWidth - PAD - (sx + sw)
  if (sx + dx < PAD) dx = PAD - sx
  if (sy + sh > innerHeight - PAD) dy = innerHeight - PAD - (sy + sh)
  if (sy + dy < PAD) dy = PAD - sy
  if (keep) {
    dx = Math.min(Math.max(dx, Math.min(0, PAD - keep.left)), Math.max(0, innerWidth - PAD - keep.right))
    dy = Math.min(Math.max(dy, Math.min(0, PAD - keep.top)), Math.max(0, innerHeight - PAD - keep.bottom))

  if (dx || dy) animateView({ x: view.x + dx, y: view.y + dy, z: view.z })

/* ============ 配置 ============
   置く場所は、ブロックを作るときに一度だけ決める。以後その位置を変えるのは人のドラッグだけ。
   ブロックが伸びても、ほかのブロックは押さない。重なってよく、触ったブロックが前に出る。
   追い質問は、元の一節の高さで元の右の列を第一候補にし、空いていて画面に見えている近くの場所を選ぶ。
   候補の良し悪しは、理想の位置からの距離に、画面からはみ出す量、線がほかのブロックの下をくぐるか、
   同じ元から出た線と交わるかを足して比べる。
   空き地の判定には伸びる余地も入れる。書いている途中のブロックは ROOM の高さまで伸びるとみる。
   根の会話はこの先も下へ伸び続けるので、その列の下には置かない */
const GAP = 24, COL_GAP = 72, ROOM = 360, ENTRY = 26, REACH = 720
const ro = new ResizeObserver(() => scheduleLinks())
let linksQueued = false
function scheduleLinks() { if (!linksQueued) { linksQueued = true; requestAnimationFrame(() => { linksQueued = false; drawLinks() }) } }
function setPos(t) { const el = ui.get(t.id).el; el.style.left = t.pos.x + 'px'; el.style.top = t.pos.y + 'px' }
const rectOf = t => { const el = ui.get(t.id).el; return { x: t.pos.x, y: t.pos.y, w: el.offsetWidth, h: el.offsetHeight } }
const overlaps = (a, b, m = 0) => a.x < b.x + b.w + m && a.x + a.w + m > b.x && a.y < b.y + b.h + m && a.y + a.h + m > b.y
const midOf = (rect, block) => (rect.top + rect.height / 2 - block.getBoundingClientRect().top) / view.z
const growing = t => { const m = t.messages.at(-1); return m?.role === 'ai' && m.phase !== 'done' && m.phase !== 'failed' }
const hiddenPx = (r, v) => Math.max(0, v.x - r.x) + Math.max(0, r.x + r.w - v.x - v.w) + Math.max(0, v.y - r.y) + Math.max(0, r.y + r.h - v.y - v.h)

// 線の起点の高さ (元のブロックの上端から)。続きを書き直す間は一節や図が消えるので、最後に測った高さに留める
function anchorRect(t) {
  const q = t.origin.quote
  return q.kind === 'text' ? quoteRange(t)?.getClientRects()[0] : mediaEl(q.key)?.getBoundingClientRect()
}
function anchorOf(t) {
  const block = ui.get(t.origin.threadId)?.el, rect = anchorRect(t)
  if (block && rect) t.anchor = midOf(rect, block)
  return t.anchor ?? ENTRY
}
// 作った直後に見えていてほしい部分 (引用、問い、考えている行) の高さ。入力欄はその下にあり、すぐには要らない
function headOf(t) {
  const u = ui.get(t.id)
  return u.comp ? (u.comp.el.getBoundingClientRect().top - u.el.getBoundingClientRect().top) / view.z : u.el.offsetHeight
}
// 線の行き先の高さ (追い質問の上端から)。引用の行の中ほど
function entryOf(t) {
  const u = ui.get(t.id)
  return u.quoteEl ? midOf(u.quoteEl.getBoundingClientRect(), u.el) : ENTRY
}
// 元から行き先までの線が通る帯。ほかのブロックの下をくぐる場所は、なるべく選ばない
function linkBand(S, y1, r, y2) {
  const right = r.x >= S.x + S.w / 2
  const x1 = right ? S.x + S.w : r.x + r.w, x2 = right ? r.x : S.x
  return { x: Math.min(x1, x2), y: Math.min(y1, y2) - 2, w: Math.abs(x2 - x1), h: Math.abs(y2 - y1) + 4 }
}
function place(t) {
  const src = threadOf(t.origin.threadId), S = rectOf(src), el = ui.get(t.id).el
  const w = el.offsetWidth, h = el.offsetHeight, head = headOf(t), entry = entryOf(t), y1 = S.y + anchorOf(t)
  const ideal = { x: S.x + S.w + COL_GAP, y: Math.round(y1 - entry) }
  const others = state.threads.filter(o => o !== t && o.pos && ui.has(o.id)).map(o => {
    const r = rectOf(o)
    const reach = o.kind === 'chat' && !o.origin ? 1e6 : growing(o) ? Math.max(r.h, ROOM) : r.h
    return { t: o, r, keep: { ...r, h: reach } }
  })
  // 同じ元から出ている線。起点の順と行き先の順が逆になる場所は、線が交わるので避ける
  const sibs = others.filter(o => o.t.origin?.threadId === src.id).map(o => ({ a: S.y + anchorOf(o.t), b: o.r.y + entryOf(o.t) }))
  const v = screenRect()
  let best = null
  for (const x of [ideal.x, ideal.x + w + COL_GAP, S.x - COL_GAP - w]) {
    for (let dy = -720; dy <= 1600; dy += 8) {
      const y = ideal.y + dy
      if (others.some(o => overlaps({ x, y, w, h: Math.max(h, ROOM) }, o.keep, GAP))) continue
      const under = others.some(o => o.t !== src && overlaps(linkBand(S, y1, { x, y, w, h }, y + entry), o.r))
      const crosses = sibs.some(s => (y1 - s.a) * (y + entry - s.b) < 0)
      const dist = Math.hypot(x - ideal.x, dy), hidden = hiddenPx({ x, y, w, h: head }, v)
      // 視点を動かさずに見える場所が届く範囲にあれば、それを必ず選ぶ。線の交わりやくぐりは、その中での順位にだけ効く
      const rank = !hidden && dist <= REACH ? 0 : 1
      const cost = dist + (under ? 240 : 0) + (crosses ? 400 : 0) + 3 * hidden
      if (!best || rank < best.rank || (rank === best.rank && cost < best.cost)) best = { x, y, rank, cost }
    }
  }
  t.pos = best ? { x: best.x, y: best.y } : ideal
  setPos(t)
}

/* ============ 重なり ============
   重なったときは、最後に触ったブロック (押した、入力欄に入った、作った) が前に出る。
   返事が流れているだけでは前に出さない。読んでいるブロックの上に、伸びてきたブロックがかぶさらないように */
let zTop = 0
function raise(el) { if (!el.style.zIndex || +el.style.zIndex < zTop) el.style.zIndex = ++zTop }

/* ============ 線 ============
   元の右端の、一節や図の高さから、行き先の引用の行へ。行き先を左へ動かしたときは逆向きに引く。線はブロックの下に描く */

}
function quoteRange(t) {

}
function drawLinks() {
  let svg = ''

    if (!src?.pos || !t.pos || !ui.has(t.id) || !ui.has(src.id)) continue
    const S = rectOf(src), U = rectOf(t)
    const range = quoteRange(t)
    if (range) quoted.push(range)
    if (t.origin.quote.key) media.add(t.origin.quote.key)
    const live = busy(t.messages.at(-1)?.phase) ? ' class="live"' : ''
    const y1 = S.y + anchorOf(t), c = curve(S, y1, U, U.y + entryOf(t))
    svg += `<path${live} data-from="${src.id}" data-to="${t.id}" d="${c.d}"/><circle${live} cx="${c.x1}" cy="${y1}" r="2.5"/>`

  linksSvg.innerHTML = svg
  if (window.CSS?.highlights) CSS.highlights.set('quoted', new Highlight(...quoted))

// 選んだ一節を、元の発言の中から探し直す。続きを書き直すと DOM が作り直されるので、範囲は持ち歩かない。
// 選択の文字列は段落の間に改行が入るので、空白を除いて比べる。図のラベルやソースは本文として数えない

  const walker = document.createTreeWalker(msgEl, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('.text') && !n.parentElement.closest('.media') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT })
  let s = ''; const map = []
  for (let n; (n = walker.nextNode());) for (let k = 0; k < n.data.length; k++) if (!/\s/.test(n.data[k])) { s += n.data[k]; map.push([n, k]) }
  const at = s.indexOf(want)
  if (at < 0) return null
  const r = document.createRange()
  r.setStart(map[at][0], map[at][1]); r.setEnd(map[at + want.length - 1][0], map[at + want.length - 1][1] + 1)

/* ============ ポップオーバー ============ */

const WIDGETS = {

/* ============ 入力欄（Composer） ============
   ミラーと変換中 (IME) の扱いは board.html の付箋と同じ。変換中は下線を隠し、確定してから解析する */

}

    h('button', { type: 'button', 'aria-label': '外す', onclick: () => { c.attachments = c.attachments.filter(x => x !== a); renderAtts(c) } }, icon('x', 10)))))

}

    .filter(({ sec }) => c.decisions[sec.key] !== undefined)
    .map(({ icon, sec }) => ({ icon, say: sec.say, value: fmt(sec, c.decisions[sec.key]) }))

/* ============ ブロック ============ */
// 追い質問の上の引用。一節なら文、画像と図なら聞いた時点の縮小
function quoteLine(q) {
  if (q.kind === 'text') return h('div', { class: 'quoteline' }, q.text)
  const line = h('div', { class: 'quoteline thumb' })
  if (q.kind === 'image') line.append(h('img', { src: q.src, alt: q.alt || '', draggable: 'false' }))
  else { line.innerHTML = q.svg; fitSvg(line.firstElementChild, 140, 52) }

}

  const el = h('article', { class: 'block' + (t.kind === 'premise' ? ' premise' : '') + (draft ? ' draft' : '') + (t.lead ? ' lead' : ''), 'data-thread': t.id }, quoteEl, msgs, comp?.el)
  world.append(el); ro.observe(el)
  ui.set(t.id, { el, msgs, msgEls: [], comp, quoteEl })

  // 前提の隣の入力欄は、空のまま離れても残す

}

  const el = h('div', { class: 'msg ai' }, assumed, h('div', { class: 'text draft' }), h('div', { class: 'text more' }), h('div', { class: 'status', role: 'status' }))

  t.messages.push(takeMessage(t.composer))
  const i = t.messages.length - 1

  mountUserMsg(t, i)

/* ============ 返事（Leaving Blanks） ============ */
const replies = new WeakMap()   // AI の発言 → { plan, gen, abort, timer, drafted }
const values = m => ({ ...m.decisions, ...m.filled })
const unfilled = m => Object.keys(m.blanks).filter(k => !(k in m.filled))
function setPhase(t, i, phase) {
  const m = t.messages[i]; m.phase = phase
  const st = msgEl(t, i).querySelector('.status')
  st.className = 'status'
  if (phase === 'thinking' || phase === 'continuing') st.replaceChildren(h('span', { class: 'spark' }, icon('sparkles', 13)), h('span', { class: 'shimmer' }, phase === 'thinking' ? '考えています' : '続きを書いています'))
  else if (phase === 'waiting') {
    const left = unfilled(m).length, total = Object.keys(m.blanks).length
    st.classList.add('needs')
    st.textContent = total > 1 && left === total ? `${left}つの空欄を埋めたら続けます` : left === 1 ? 'あと1つ埋めたら続けます' : `あと${left}つ埋めたら続けます`
  } else st.replaceChildren()
  scheduleLinks()
}
function announce(t) {
  const el = ui.get(t.id).el
  if (el.contains(document.activeElement)) return
  el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh')
}
function fail(t, i, e, retry) {
  const st = msgEl(t, i).querySelector('.status')
  t.messages[i].phase = 'failed'
  st.className = 'status failed'
  const again = h('button', { class: 'retry', type: 'button' }, 'もう一度')
  again.onclick = retry

  scheduleLinks()
}
async function startReply(t, { premise = null } = {}) {

  t.messages.push(m)
  const i = t.messages.length - 1
  const r = { plan: null, gen: 0, abort: null, timer: null, drafted: false }
  replies.set(m, r)
  mountAiMsg(t, i); setPhase(t, i, 'thinking')

  try { r.plan = await adapter.reply(ctx) } catch (e) { fail(t, i, e, () => { t.messages.splice(i, 1); msgEl(t, i).remove(); startReply(t, { premise }) }); return }

}

  let tokens
  try { tokens = await r.plan.more(values(m), ac.signal) } catch (e) { if (g === r.gen && e.name !== 'AbortError') fail(t, i, e, () => continueReply(t, i)); return }
  if (g !== r.gen) return

}

  for (const b of msgEl(t, i).querySelectorAll(`.blank[data-key="${key}"]`)) { b.textContent = fmt(m.blanks[key], v); b.classList.add('filled') }
  if (!r.drafted) return
  if (unfilled(m).length) setPhase(t, i, 'waiting')
  else if (r.plan.more) continueReply(t, i)
}

// 画像と図は、発言の中で何番目かを key に持つ。続きの番号は書き出しの続きから数えるので、書き直しても同じ key になる
const isMedia = tok => tok.image || tok.fence === 'mermaid'
async function stream(t, i, where, tokens, g) {
  const m = t.messages[i], r = replies.get(m)
  const alive = () => r.gen === g
  const box = msgEl(t, i).querySelector(where === 'draft' ? '.text.draft' : '.text.more')
  let ord = where === 'draft' ? 0 : m.parts.filter(isMedia).length
  for (const tok of tokens) {
    if (!alive()) return
    if (tok.image) { await streamImage(box, tok, mediaKey(t, i, ord++), alive); continue }
    if (tok.fence === 'mermaid') { await streamDiagram(box, tok, mediaKey(t, i, ord++), alive); continue }
    if (tok.fence !== undefined) { box.append(h('pre', {}, tok.source)); continue }
    let el
    if (tok.p) el = h('p'); else if (tok.h) el = h('h3'); else if (tok.ul) el = h('ul'); else if (tok.quote) el = h('blockquote')
    box.append(el)
    if (tok.ul) { for (const li of tok.ul) { const l = h('li'); el.append(l); await typeInline(l, li, t, i, alive) } }
    else await typeInline(el, tok.p || tok.h || tok.quote, t, i, alive)
    await sleep(110)
  }
}
async function typeInline(el, parts, t, i, alive) {
  const m = t.messages[i]
  for (const part of parts) {
    if (!alive()) return
    if (typeof part === 'string') {
      const node = document.createTextNode(''); el.append(node)
      for (let k = 0; k < part.length; k += 3) { if (!alive()) return; node.data = part.slice(0, k + 3); await sleep(28) }
    } else if (part.blank) {
      const key = part.blank, spec = m.blanks[key]
      const b = h('button', { class: 'blank', type: 'button', 'data-key': key }, spec.label)
      if (key in m.filled) { b.textContent = fmt(spec, m.filled[key]); b.classList.add('filled') }
      b.onclick = () => openPop(b, [{ ...spec, key }], k => m.filled[k] ?? (spec.type === 'range' ? spec.def : undefined), (k, v) => fillBlank(t, i, k, v))
      el.append(b); await sleep(240)
    } else if (part.ref) el.append(h('span', { class: 'ref' }, refText(m, part.ref)))
  }
}
function refText(m, key) {
  const v = values(m)[key]
  return v == null ? '' : fmt(m.blanks[key] || SECTION[key], v)
}

/* ============ 本文の中の画像と図 ============
   幅は本文の幅まで。高さは、画像は 360px (CSS)、図は DIAGRAM_MAX_H まで縮める。図は文字が読める大きさを残したいので画像より高く取る。
   押すと「それについて聞く」入力欄が出るので、拡大は押す操作に載せない。細部はキャンバスのズームで見る */
const DIAGRAM_MAX_H = 480
// Pele は 16px の文字で測る。本文の大きさにそろえて 0.86 倍にし、上限に収まるまで縮める
function fitSvg(svg, maxW, maxH) {
  const w = +svg?.getAttribute('width'), hh = +svg?.getAttribute('height')
  if (!w || !hh) return
  const k = Math.min(0.86, maxW / w, maxH / hh)
  svg.style.width = Math.round(w * k) + 'px'; svg.style.height = Math.round(hh * k) + 'px'
}
// コードブロックが開いたらソースを流し、閉じてから一度だけ描く
async function streamDiagram(box, tok, key, alive) {
  const src = h('pre', { class: 'src' })
  const fig = h('figure', { class: 'media diagram', 'data-key': key, role: 'img', 'aria-label': diagramName(tok.source) }, src)
  box.append(fig)
  const lines = tok.source.split('\n')
  for (let k = 0; k < lines.length; k++) {
    if (!alive()) return
    src.textContent = lines.slice(0, k + 1).join('\n')
    await sleep(60)
  }
  let svg = null, error = null
  const pele = await pelePromise
  if (!alive()) return
  const draw = s => pele.render(s, { fontFamily: getComputedStyle(document.body).fontFamily }).svg
  if (!tok.closed) error = new Error('コードブロックが閉じていません')
  else if (!pele) error = new Error('Pele を読み込めませんでした')
  else try { svg = draw(tok.source) } catch (e) {
    // 描けない図は、ソースとエラーを渡して AI に一度だけ直させる。直したものも描けなければソースを見せる
    fig.classList.add('repairing')
    let fixed
    try { fixed = await adapter.repairDiagram({ source: tok.source, error: String(e.message) }) } catch { fixed = null }
    if (!alive()) return
    fig.classList.remove('repairing')
    try { if (fixed == null) throw e; svg = draw(fixed); tok.source = fixed } catch (e2) { error = e2 }
  }
  if (svg) { fig.innerHTML = svg; fitSvg(fig.firstElementChild, box.clientWidth, DIAGRAM_MAX_H); fig.classList.add('ready') }
  else fig.replaceChildren(h('div', { class: 'err' }, icon('alert', 13), h('span', {}, (tok.closed ? '図にできませんでした。' : '') + String(error.message).split('\n')[0])), h('pre', { class: 'code' }, tok.source))
  await sleep(200)
}
async function streamImage(box, tok, key, alive) {
  const fig = h('figure', { class: 'media image', 'data-key': key }, h('div', { class: 'ph' }))
  box.append(fig)
  await sleep(900)
  if (!alive()) return
  fig.replaceChildren(h('img', { src: tok.image, alt: tok.alt || '', draggable: 'false' }))
  fig.classList.add('ready')
}

/* ============ 選んだ一節や画像・図について聞く ============
   文を選ぶか、画像や図を押すと、その下に問いを書く欄が出る。問いを書いて送ると、その問いから始まるブロックが線でつながる。
   空のままでは送れない */
const pill = $('#pill'), pillInput = $('#pill input'), pillGo = $('#pill .go')
pillGo.append(icon('arrowUp', 14))
let pick = null   // { threadId, msgIndex, quote: Quote, fig? }
const canAsk = () => !!pick && !!pillInput.value.trim()
const syncPill = () => { pillGo.disabled = !canAsk() }
pillInput.addEventListener('input', syncPill)
function hidePill() {
  if (pill.hidden) return
  pill.hidden = true; pillInput.value = ''
  pick?.fig?.classList.remove('picking')
  pick = null; syncPill()
  window.CSS?.highlights?.delete('picking')
}
function showPill(p, r) {
  pick = p; pillInput.value = ''; syncPill()
  pill.hidden = false
  const pw = pill.offsetWidth
  pill.style.left = Math.min(innerWidth - pw - 12, Math.max(12, r.left + r.width / 2 - pw / 2)) + 'px'
  pill.style.top = Math.min(innerHeight - 52, r.bottom + 10) + 'px'
}
document.addEventListener('mouseup', e => {
  // 画像と図は click で欄を出す。ここで閉じると、その欄まで消してしまう
  if (pill.contains(e.target) || e.target.closest?.('.media.ready')) return
  setTimeout(() => {
    const sel = getSelection()
    const text = sel && !sel.isCollapsed ? sel.toString().trim() : ''
    const node = sel?.anchorNode?.parentElement
    const box = text && !node?.closest('.media') ? node?.closest('.msg.ai .text') : null
    const t = box && threadOf(box.closest('.block').dataset.thread)
    hidePill()
    if (!t) return
    const range = sel.getRangeAt(0).cloneRange()
    // 欄に移ると選択が消えるので、ハイライトで残す
    window.CSS?.highlights?.set('picking', new Highlight(range))
    showPill({ threadId: t.id, msgIndex: ui.get(t.id).msgEls.indexOf(box.closest('.msg')), quote: { kind: 'text', text } }, range.getBoundingClientRect())
  })
})
// 押したときの見た目を引用に写す。図は Mermaid のソースも持つ (サーバーに渡す問いの文脈になる)
function askAboutMedia(fig) {
  const [threadId, i, ord] = fig.dataset.key.split(':'), t = threadOf(threadId), m = t?.messages[+i]
  if (!m) return
  const img = fig.querySelector('img'), svg = fig.querySelector('svg')
  const quote = img
    ? { kind: 'image', key: fig.dataset.key, src: img.src, alt: img.alt }
    : { kind: 'diagram', key: fig.dataset.key, svg: svg.outerHTML, source: [...m.parts, ...m.more].filter(isMedia)[+ord]?.source ?? '' }
  getSelection().removeAllRanges()
  hidePill()
  fig.classList.add('picking')
  showPill({ threadId, msgIndex: +i, quote, fig }, fig.getBoundingClientRect())
  pillInput.focus({ preventScroll: true })
}
pillGo.addEventListener('pointerdown', e => e.preventDefault())
pillGo.onclick = () => { if (canAsk()) spawn(pick, pillInput.value.trim()) }
pillInput.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return
  e.preventDefault()
  if (canAsk()) spawn(pick, pillInput.value.trim())
})
// 問いから始まるブロックを、元の近くの空いた場所に置く。画面の外にかかるときだけ、視点を寄せて見せる
function spawn({ threadId, msgIndex, quote }, question) {
  const t = newThread({ origin: { threadId, msgIndex, quote } })
  hidePill(); getSelection().removeAllRanges()
  mountThread(t)
  t.messages.push({ role: 'user', parts: [{ text: question }], images: [], decisions: {}, assumptions: [] }); mountUserMsg(t, 0)
  startReply(t)
  place(t)
  drawLinks()
  // 図は丈が高いので、線の起点の帯だけを画面に残す
  const a = anchorRect(t), mid = a && a.top + a.height / 2
  reveal({ ...rectOf(t), h: headOf(t) }, a && (quote.kind === 'text' ? a : { left: a.left, right: a.right, top: mid - 20, bottom: mid + 20 }))
}

/* ============ 引用と追い質問を行き来する ============
   元の一節を押すと追い質問のブロックへ、追い質問の上の引用を押すと元の一節や図へ、画面を寄せる。
   画像と図を押すのは「それについて聞く」に使うので、そこから追い質問へは線をたどる */
const followUpsOf = threadId => state.threads.filter(t => t.origin?.threadId === threadId && t.origin.quote.kind === 'text')
function quoteAt(textEl, x, y) {
  const block = textEl.closest('.block')
  for (const t of block ? followUpsOf(block.dataset.thread) : []) {
    const r = quoteRange(t)
    if (r && [...r.getClientRects()].some(q => x >= q.left - 1 && x <= q.right + 1 && y >= q.top - 1 && y <= q.bottom + 1)) return { t, r }
  }
  return null
}
function flash(el, cls = 'fresh') { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls) }
function showThread(t) { centerOn(rectOf(t)); flash(ui.get(t.id).el) }
function showQuote(t) {
  const q = t.origin.quote, target = q.kind === 'text' ? quoteRange(t) : mediaEl(q.key)
  if (!target) return
  const b = target.getBoundingClientRect(), p = toWorld(b.left, b.top)
  centerOn({ x: p.x, y: p.y, w: b.width / view.z, h: b.height / view.z })
  if (q.kind !== 'text') { flash(target, 'flash'); setTimeout(() => target.classList.remove('flash'), T(1400)); return }
  window.CSS?.highlights?.set('quote-flash', new Highlight(target))
  setTimeout(() => window.CSS?.highlights?.delete('quote-flash'), T(1400))
}
world.addEventListener('click', e => {
  const fig = e.target.closest('.media.ready')
  if (fig) { if (pick?.fig !== fig) askAboutMedia(fig); return }
  const sel = getSelection()
  if (sel && !sel.isCollapsed) return
  const line = e.target.closest('.quoteline')
  if (line) { const t = threadOf(line.closest('.block').dataset.thread); if (t?.origin) showQuote(t); return }
  const text = e.target.closest('.msg.ai .text'), hit = text && quoteAt(text, e.clientX, e.clientY)
  if (hit) showThread(hit.t)
})
let hoverText = null
world.addEventListener('pointermove', e => {
  if (e.buttons) return
  const text = e.target.closest?.('.msg.ai .text') || null, hit = text && quoteAt(text, e.clientX, e.clientY)
  if (hoverText && hoverText !== text) hoverText.classList.remove('onquote')
  hoverText = text
  text?.classList.toggle('onquote', !!hit)
  if (hit) CSS.highlights?.set('quoted-hover', new Highlight(hit.r))
  else CSS.highlights?.delete('quoted-hover')
})

/* ============ ドラッグ ============
   文字と入力欄の外 (ブロックの縁、発言の間、引用の行、画像と図) をつかんで動かす。文字の上は選択に使う。
   動くのはつかんだブロックだけ。ほかのブロックは押さず、重なってよい。線はついてくる */
const NOT_GRIP = 'textarea, input, button, .text, .bubble, .composer'
let suppressClick = false
world.addEventListener('pointerdown', e => {
  if (e.button !== 0) return
  const host = e.target.closest('.block'), t = host && threadOf(host.dataset.thread)
  if (!t?.pos || (e.target.closest(NOT_GRIP) && !e.target.closest('.media.ready'))) return
  e.preventDefault()
  const ox = e.clientX, oy = e.clientY, p0 = { ...t.pos }
  let moved = false
  const move = m => {
    if (!moved && Math.hypot(m.clientX - ox, m.clientY - oy) < 4) return
    if (!moved) { moved = true; host.classList.add('dragging'); document.body.classList.add('dragging'); closePop(); hidePill() }
    t.pos = { x: Math.round(p0.x + (m.clientX - ox) / view.z), y: Math.round(p0.y + (m.clientY - oy) / view.z) }
    setPos(t); drawLinks()
  }
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up)
    host.classList.remove('dragging'); document.body.classList.remove('dragging')
    if (moved) { suppressClick = true; setTimeout(() => { suppressClick = false }) }
  }
  addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up)
})
world.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault() } }, true)

/* ============ 始まり ============
   ?scenario=travel|flow|naming は入力欄に例文を入れておく (画面には出さない、試すための入口)
   ?premise=<スキルの引数> は、左に前提を置き、その右の入力欄から始める */
const SCENARIOS = { travel: '週末に家族で京都旅行の計画を立てたい', flow: 'AIの返事が届くまでの流れを状態図にしたい', naming: 'アプリの名前を考えたい' }
function prefill(c, u) {
  const text = SCENARIOS[params.get('scenario')]
  if (!text) return
  c.text = text; u.ta.value = text; u.sync(); analyzeComposer(c)
  u.ta.setSelectionRange(text.length, text.length)
}
const hero = { composer: newComposer() }
const heroUI = mountComposer(hero.composer, { variant: 'hero', placeholder: '何を考えますか？', onSend: sendFromHero })
$('#hero').prepend(heroUI.el)
if (params.has('premise')) startWithPremise(params.get('premise'))
else { prefill(hero.composer, heroUI); heroUI.ta.focus() }

// 前提は左に、会話の入力欄はその右の上端に置く。前提から出した追い質問は、place() が空いた場所を選ぶ
function startWithPremise(arg) {
  state.mode = 'canvas'
  document.body.classList.remove('hero')
  heroUI.el.style.visibility = 'hidden'
  const p = newThread({ pos: { x: 48, y: 64 }, kind: 'premise' })
  const pu = mountThread(p)
  startReply(p, { premise: arg })
  const t = newThread({ pos: { x: 48 + pu.el.offsetWidth + COL_GAP, y: 64 }, lead: true })
  const u = mountThread(t, { draft: true })
  prefill(t.composer, u.comp)
  u.comp.ta.focus({ preventScroll: true })
}

function sendFromHero() {
  const I = heroUI.el.getBoundingClientRect()
  const fieldR = heroUI.ta.getBoundingClientRect()
  const text = hero.composer.text.trim()
  const msg = takeMessage(hero.composer)
  state.mode = 'canvas'
  document.body.classList.remove('hero')
  const W = 460
  const t = newThread({ pos: { x: Math.round((innerWidth - W) / 2), y: 80 } })
  t.messages.push(msg)
  const u = mountThread(t)
  mountUserMsg(t, 0)
  startReply(t)   // 考えている行まで同期で置かれるので、着地点はそれを含んだ大きさになる
  morph(I, fieldR, u.el, text)
  heroUI.el.style.visibility = 'hidden'
  u.comp.ta.focus({ preventScroll: true })
}
// 入力欄の外形がブロックの外形へ縮み、書いた文が吹き出しの位置へ移る。中身は外形が着く直前に現れる
function morph(I, fieldR, block, text) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return   // WAAPI は CSS の reduced-motion 指定では止まらない
  const F = block.getBoundingClientRect()
  const bubble = block.querySelector('.bubble')
  const B = bubble?.getBoundingClientRect()
  const dur = T(560), ease = 'cubic-bezier(.22,1,.36,1)'
  const shell = h('div', { class: 'ghost-shell' })
  document.body.append(shell)
  shell.animate([
    { left: I.left + 'px', top: I.top + 'px', width: I.width + 'px', height: I.height + 'px', borderRadius: '22px' },
    { left: F.left + 'px', top: F.top + 'px', width: F.width + 'px', height: F.height + 'px', borderRadius: '16px' },
  ], { duration: dur, easing: ease, fill: 'forwards' })
  shell.animate([{ opacity: 1 }, { opacity: 0 }], { duration: T(160), delay: dur, fill: 'forwards' }).onfinish = () => shell.remove()
  block.animate([{ opacity: 0 }, { opacity: 0, offset: 0.55 }, { opacity: 1 }], { duration: dur, easing: 'ease-out' })
  if (bubble && text) {
    const g = h('div', { class: 'ghost-text', style: `left:${fieldR.left}px;top:${fieldR.top}px;width:${fieldR.width}px;font-size:16px;line-height:1.7` }, text)
    document.body.append(g)
    bubble.style.visibility = 'hidden'
    const k = 14 / 16
    g.animate([{ transform: 'none' }, { transform: `translate(${B.left + 12 - fieldR.left}px,${B.top + 5 + 0.3 - fieldR.top}px) scale(${k})` }], { duration: dur, easing: ease, fill: 'forwards' })
      .onfinish = () => { bubble.style.visibility = ''; g.remove() }
  }
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return
  closePop(); hidePill()
  const t = state.threads.find(t => !t.messages.length && !t.lead && ui.get(t.id).el.contains(document.activeElement))
  if (t && !t.composer.text.trim()) removeThread(t)
})
applyView()
</script>
</body>
</html>
